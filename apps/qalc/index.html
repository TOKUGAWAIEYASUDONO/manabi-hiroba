<p>Qalc（カルク）は「けいさん スプリント」に なかまいり しました。</p>
<p><a href="../../index.html#units?kid=1&amp;subj=sansu">けいさん スプリントへ</a></p>
<script>
/* 前の Qalc のサービスワーカーを止めてから移動する（記録 qalc_* は消さない） */
(async()=>{try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){if(r.scope.indexOf("/apps/qalc/")>=0)await r.unregister();}}
if(self.caches){const ks=await caches.keys();for(const k of ks){if(k.indexOf("qalc-cache-")===0)await caches.delete(k);}}}catch(e){}
location.replace("../../index.html#units?kid=1&subj=sansu");})();
</script>
</body></html>
