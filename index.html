/* 吹き出し：動いた子の名前を、そのアイコンの上に約1.2秒。同時に最大5つ（古いものから消す）。
   まだ出ていない子を先に出し、同じ子は続けて出さない。出すのは良いことだけ（まちがい・失点・最下位は出さない）。
   クイズの「答えた」は、名前も正誤も出さず、動物の絵だけ。名前は先生の端末のメモリの上でだけ使い、どこにも保存しない */
const POP={ms:1200,max:5,cool:4000,burst:3};
const PST={seen:new Set(),last:new Map(),live:[],prev:null,st:""};
function popReset(){ PST.seen=new Set(); PST.last=new Map(); }
function popInit(){ PST.prev=null; PST.st=""; PST.live=[]; popReset(); const l=document.getElementById("poplayer"); if(l) l.innerHTML=""; }
function popLayer(){ let l=document.getElementById("poplayer"); if(!l){ l=document.createElement("div"); l.id="poplayer"; l.className="poplayer"; l.setAttribute("aria-hidden","true"); document.body.appendChild(l); } return l; }
function popAnchor(pid){
  const pk=M&&M.pk&&M.pk[pid];
  if(pk){      // すごろくの駒：動いた先のマスの位置（動いている途中でも、行き先で測る）
    const svg=pk.el.ownerSVGElement, m=svg&&svg.getScreenCTM(), b=cellXY(pk.tgt);
    if(m){ const pt=svg.createSVGPoint(); pt.x=b.x; pt.y=b.y-20; const q=pt.matrixTransform(m), sz=40*m.a; return {r:{left:q.x-sz/2,right:q.x+sz/2,top:q.y-sz/2,width:sz,height:sz},side:false}; }
  }
  let el=null;
  if(!el) el=document.querySelector('.px [data-pid="'+pid+'"],.qzh [data-pid="'+pid+'"]');
  if(!el) return null;
  const row0=el, row=!!(el.classList&&(el.classList.contains("px-row")||el.classList.contains("r")));      // 順位の行：上の行をかくさないよう、アイコンの右に出す
  const ic=el.querySelector&&el.querySelector(".fc"); if(ic) el=ic;      // 吹き出しは、その子のアイコンのそばに出す
  let r=el.getBoundingClientRect(); if(!(r.width||r.height)) return null;
  if(row&&row0.classList.contains("px-row")&&row0.parentElement){      // 順位の棒は動いている途中なので、動いた先の高さで測る
    const b=row0.parentElement.getBoundingClientRect(), top=b.top+(parseFloat(row0.style.top)||0)+(row0.offsetHeight-r.height)/2;
    r={left:r.left,right:r.right,top,width:r.width,height:r.height};
  }
  return {r,side:row};
}
function popShow(ev){
  if(params().path!=="host") return;
  if(PST.live.length>=POP.max){ if(!ev.fresh) return; const o=PST.live.shift(); o.el.remove(); }      // いっぱいのときは、まだ出ていない子のために古いものを消す
  const l=popLayer(), el=document.createElement("div"); el.className="pop";
  const mark={join:"👋",get:"🪙",star:"⭐",move:"👣",goal:"🏁",rk1:"🔥",rk2:"⚡",rk3:"⭐"}[ev.k]||"";
  el.innerHTML=ev.anon?`${face(ev.emoji)}<span class="pn">こたえた！</span>`:`${face(ev.emoji)}<span class="pn"></span><span class="pi">${mark}</span>`;
  if(!ev.anon) el.querySelector(".pn").textContent=ev.name;
  l.appendChild(el);
  const used=new Set(PST.live.map(o=>o.slot)); let slot=0; while(used.has(slot)) slot++;
  const a=ev.anon?null:popAnchor(ev.pid), W=innerWidth, H=innerHeight;
  let x,y;
  if(a&&a.side){ el.classList.add("side"); x=a.r.right+12; y=a.r.top+a.r.height/2; x=Math.max(4,Math.min(W-260,x)); y=Math.max(30,Math.min(H-30,y)); }
  else { if(a){ x=a.r.left+a.r.width/2; y=a.r.top-2; } else { x=W*(slot+.5)/POP.max; y=H-130; }      // 置き場所が無いとき（クイズなど）は、下の帯に並べる
    x=Math.max(110,Math.min(W-110,x)); y=Math.max(70,Math.min(H-20,y)); }
  el.style.left=x+"px"; el.style.top=y+"px";
  const o={el,pid:ev.pid,slot}; PST.live.push(o);
  setTimeout(()=>{ el.remove(); const i=PST.live.indexOf(o); if(i>=0) PST.live.splice(i,1); },POP.ms+60);
}
function popFeed(evs){
  const now=Date.now(); let n=0;
  evs.sort((a,b)=>(PST.seen.has(a.pid)?1:0)-(PST.seen.has(b.pid)?1:0));          // まだ出ていない子を先に
  for(const ev of evs){
    const fresh=!PST.seen.has(ev.pid);
    if(!fresh&&now-(PST.last.get(ev.pid)||0)<POP.cool) continue;                  // 同じ子が続けて出ない
    if(n>=POP.burst&&!fresh) continue;
    if(PST.live.length>=POP.max&&!fresh) continue;
    PST.last.set(ev.pid,now); PST.seen.add(ev.pid); n++; ev.fresh=fresh;
    if(ev.delay) setTimeout(()=>popShow(ev),ev.delay); else popShow(ev);
  }
}
/* 前回の状態との差から、吹き出しにするできごとを作る */
function popStep(s){
  const prev=PST.prev; PST.prev=s;
  if(PST.st!==s.status){ if(s.status==="playing") popReset(); PST.st=s.status; for(const o of PST.live) o.el.remove(); PST.live=[]; }     // ゲームのはじまりで「まだ出ていない」を数えなおす
  if(!prev||prev.code!==s.code||prev.status!==s.status) return;
  const was=new Map(prev.players.map(p=>[p.pid,p])), evs=[], mk=(p,k,o)=>({pid:p.pid,name:p.name,emoji:p.emoji,k,...o});
  for(const p of s.players){
    const o=was.get(p.pid);
    if(s.status==="lobby"){ if(!o) evs.push(mk(p,"join")); continue; }
    if(s.status!=="playing"||!o) continue;
    if(s.quiz){ if(s.quiz.phase==="q"&&prev.quiz&&prev.quiz.phase==="q"&&prev.quiz.idx===s.quiz.idx&&p.a&&!o.a) evs.push(mk(p,"ans",{anon:true,name:""})); continue; }
    const d=p.v-o.v; if(d<=0) continue;
    if(s.mode==="chest") evs.push(mk(p,"get"));
    else if(p.v>=GOAL) evs.push(mk(p,"goal",{delay:300}));
    else evs.push(mk(p,"move",{delay:300}));      // 駒が動きはじめてから出す（進んだときだけ。もどったときは出さない）
  }
  if(evs.length) popFeed(evs);
}
/*T-END*/
function pxEvents(s,prev,evs){      // 前回との差から「できごと」を作る（新しい順に最大5つ）
  if(!prev) return;
  const was=new Map(prev.players.map(p=>[p.pid,p])), out=[];
  for(const p of s.players){
    const o=was.get(p.pid); if(!o||p.v===o.v) continue;
    const d=p.v-o.v, w=`${face(p.emoji)}<b>${esc(p.name)}</b>`, anon=`<b>${T("px.ev.who")}</b>`;      // 良いことだけ名前を出す。失点・もどるときは「だれか」
    if(s.mode==="chest") out.push([Math.abs(d),d>0?T("px.ev.get",w,d):T("px.ev.lose",anon,-d)]);
    else if(p.v>=GOAL) out.push([99,T("px.ev.goal",w)]);
    else out.push([Math.abs(d),d>0?T("px.ev.move",w,d):T("px.ev.back",anon,-d)]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  for(const e of out.slice(0,3)) evs.unshift(e[1]);
  evs.length=Math.min(evs.length,s.mode==="race"?3:4);
}
function renderHost(){
  setLG(0);
  HOST=HOST||sget("mh_host"); if(!HOST) return go("#teacher");
  if(NETMODE==="p2p"&&(!HR||HR.code!==HOST.code)){
    app.innerHTML=`<div class="q">この部屋はもうありません。<br>先生の端末がサーバー役なので、ページを開き直すと部屋は消えます。<br><button class="btn" onclick="go('#teacher')">新しい部屋を作る</button></div>`; return;   //T
  }
  const warn=()=>NETMODE==="p2p"?`<div class="banner">${ic("triangle-alert")} この端末がサーバー役です。対戦が終わるまで、この画面を閉じないでください。<span id="wlmsg" style="display:block">${wlText()}</span></div>`:"";   //T
  wakeOn();          // 画面のスリープを防ぐ（対応端末のみ。他の画面へ移ると route() で解放）
  const joinUrl=location.origin+location.pathname+(NETMODE==="server"?"?net=server":"")+"#join?code="+HOST.code;
  let last=null, off=0, prev=null, kind="", dockKind="", B={}, evs=[];
  M=null; popInit(); nameMenuClose();
  app.innerHTML=`<div class="px" id="px"></div><div class="px-dock" id="pxdock"></div>`;
  const px=document.getElementById("px");
  const err=e=>{ const el=document.getElementById("herr"); if(el) el.textContent=errMsg(e&&e.message); };
  function dockSet(k){
    if(dockKind===k) return; dockKind=k;
    const d=document.getElementById("pxdock");
    const note=`<details class="px-note"><summary>${T("px.memo")}</summary><div class="pn">${warn()}${privacy()}<div class="note">${T("px.url")}${esc(joinUrl)}</div><div class="note">全員《ぜんいん》がそろったら「入室をしめきる」を押してください（ゲームが始まると、あとからは入れません）。コードを教室の外の人に知られたときは、「先生の画面」にもどって部屋を作りなおすと、新しいコードになります。名前が気になる子は、名前を押すと変えたり出したりできます。</div><div class="err" id="herr"></div></div></details>`;   //T
    const bk=`<button type="button" class="btn sub" onclick="go('#teacher')">${ic("arrow-left")}${T("px.back")}</button>`;
    const main=k==="lobby"?`<button type="button" class="btn sub" id="hcl" aria-pressed="false">${ic("lock")}<span id="hclt">${T("px.close")}</span></button><button type="button" class="btn" id="hs">${T("px.start")}</button>`
      :k==="rkend"?`<button type="button" class="btn" id="hn">${T("px.new")}</button>`
      :k==="end"?`${csvOptHtml()}<button type="button" class="btn sub" id="hc">${T("px.copy")}</button><button type="button" class="btn" id="hn">${T("px.new")}</button>`
      :`<button type="button" class="btn sub" id="he">${T("px.end")}</button>`;
    d.innerHTML=note+bk+main+fsBtn();
    const b=id=>document.getElementById(id);
    if(b("hs")) b("hs").onclick=()=>api("start",HOST).catch(err);
    if(b("hcl")) b("hcl").onclick=()=>api("close",{...HOST,on:!(last&&last.closed)}).catch(err);      // 入室のしめきり（待合室でも参加を止める）
    if(b("he")) b("he").onclick=()=>{ if(confirm("対戦を終わりにしますか？")) api("end",HOST).catch(()=>{}); };   //T
    if(b("hn")) b("hn").onclick=async()=>{ try{ const r=await api("create",roomArgs(HOST)); HOST={...HOST,...r}; sset("mh_host",HOST); route(); }catch(e){ err(e); } };
    if(b("hc")) b("hc").onclick=()=>navigator.clipboard?.writeText(B.tsv()).then(()=>b("hc").textContent=T("r.copied"),()=>{});
  }
  const lobbyBuild=s=>{
    px.className="px";
    px.innerHTML=`<div class="px-lobby"><div class="lcol"><div class="lead">${T("px.code")}</div><div class="bigcode">${s.code}</div>
        <div class="cnt">${T("px.n")}<b id="pxn"></b>${T("px.nin")}</div><div class="lockmsg hidden" id="pxlock" role="status">${ic("lock")} ${T("px.locked")}</div><div class="chips" id="pxchips"></div></div>
      <div class="rcol"><div class="qrbox" id="qrbox"></div></div></div>`;
    showQr(document.getElementById("qrbox"),joinUrl);
  };
  const lobbyUpd=s=>{
    document.getElementById("pxn").textContent=s.players.length;
    const hs=document.getElementById("hs"); if(hs) hs.disabled=!s.players.length;
    const cl=document.getElementById("hcl"), lk=document.getElementById("pxlock");      // しめきりの表示
    if(cl){ document.getElementById("hclt").textContent=T(s.closed?"px.open":"px.close"); cl.setAttribute("aria-pressed",s.closed?"true":"false"); }
    if(lk) lk.classList.toggle("hidden",!s.closed);
    const lim=B.allChips?60:12;      // 名前を押すと、名前をかえる／ニックネームにする／へやから出す
    const chips=s.players.slice(0,lim).map(p=>`<button type="button" class="chip nmb" data-pid="${esc(p.pid)}">${face(p.emoji)} ${esc(p.name)}</button>`).join("")
      +(s.players.length>lim?`<button type="button" class="chip more" id="pxmorebtn">${T("px.more",s.players.length-lim)}</button>`:"");
    document.getElementById("pxchips").innerHTML=chips||`<span class="chip more">${T("px.none")}</span>`;
    const mb=document.getElementById("pxmorebtn"); if(mb) mb.onclick=()=>{ B.allChips=true; lobbyUpd(s); };
  };
  const RH=58;
  const chestBuild=(s,m,x)=>{
    px.className="px";
    px.innerHTML=`<div class="px-play"><div class="px-l"><div class="px-ttl">${m.ico} ${m.t}・${x.t}</div><div class="px-bars" id="pxbars"></div><div class="px-more" id="pxmore"></div></div>
      <div class="px-r"><div class="px-tl">${T("px.left")}</div><div class="px-timer" id="pxt"></div><h3 class="px-h">${T("px.ev")}</h3><div class="px-ev" id="pxev"></div></div></div>`;
    B.rows=new Map();
  };
  const chestUpd=s=>{
    const ps=sorted(s.players), max=Math.max(1,...ps.map(p=>p.v)), box=document.getElementById("pxbars"), vis=pxVis(ps.length,8);
    box.style.height=Math.max(1,vis)*RH+"px";
    for(const [pid,r] of [...B.rows]) if(!ps.some(p=>p.pid===pid)){ r.remove(); B.rows.delete(pid); }      // へやから出された子
    ps.forEach((p,i)=>{
      let r=B.rows.get(p.pid);
      if(!r){ r=document.createElement("div"); r.className="px-row"; r.dataset.pid=p.pid; r.setAttribute("role","button"); r.tabIndex=0; r.innerHTML=`<span class="rk"></span><span class="ic"></span><span class="nm"></span><span class="bar"><i></i></span><span class="val"></span>`; box.appendChild(r); B.rows.set(p.pid,r); }
      if(r.dataset.e!==p.emoji){ r.dataset.e=p.emoji; r.querySelector(".ic").innerHTML=face(p.emoji); }
      r.querySelector(".nm").textContent=p.name;
      r.style.display=i<vis?"":"none"; r.style.top=i*RH+"px";
      r.querySelector(".rk").textContent=i+1; r.querySelector(".bar i").style.width=Math.max(3,Math.round(p.v/max*100))+"%"; r.querySelector(".val").textContent="🪙 "+p.v;
    });
    document.getElementById("pxmore").textContent=ps.length>vis?T("px.more",ps.length-vis):"";
  };
  const raceBuild=(s,m,x)=>{
    px.className="px px-race-w";
    px.innerHTML=`<div class="px-race"><div class="px-bd" id="pxbd">${boardSvg(evOf(s.rule))}</div>
      <div class="px-r"><div class="px-ttl">${m.ico} ${m.t}・${x.t}</div><div class="px-tl">${T("px.left")}</div><div class="px-timer" id="pxt"></div>
        <h3 class="px-h">${T("px.top3")}</h3><div class="px-top" id="pxtop"></div><div class="px-more" id="pxmore"></div>
        <h3 class="px-h">${T("px.ev")}</h3><div class="px-ev" id="pxev"></div></div></div>`;
    M={pk:{},host:true};
  };
  const raceUpd=s=>{
    const ps=sorted(s.players);
    document.getElementById("pxtop").innerHTML=ps.slice(0,3).map((p,i)=>`<div class="r" data-pid="${esc(p.pid)}" role="button" tabindex="0"><span class="rk">${i+1}</span>${face(p.emoji)}<span class="nm">${esc(p.name)}</span><span class="val">${p.v}${T("px.masu")}</span></div>`).join("");
    document.getElementById("pxmore").textContent=ps.length>3?T("px.more",ps.length-3):"";
    if(M&&M.pk){
      for(const k of Object.keys(M.pk)) if(!s.players.some(p=>p.pid===k)){ M.pk[k].el.remove(); clearTimeout(M.pk[k].timer); delete M.pk[k]; }      // へやから出された子
      syncPieces(s.players.map(p=>({n:p.pid,e:p.emoji,v:p.v,me:false})));      // 駒の目印は pid（名前を使わない）
    }
  };
  const endBuild=s=>{
    M=null; px.className="px";
    const ps=sorted(s.players), rows=ps.map((p,i)=>{const t=p.ok+p.ng;return {i:i+1,p,t,acc:t?Math.round(p.ok/t*100):0}});
    const ans=rows.filter(r=>r.t>0), avg=ans.length?Math.round(ans.reduce((n,r)=>n+r.acc,0)/ans.length):0, u=rbp(unitOf(s)), vis=pxVis(rows.length,8);
    B.tsv=()=>{ const wn=csvWithNames(); return ["順位\t名前\t"+u+"\t正解\t解答数\t正答率",...rows.map(r=>`${r.i}\t${wn?r.p.name:"児童"+r.i}\t${r.p.v}\t${r.p.ok}\t${r.t}\t${r.acc}%`)].join("\n"); };   //T
    const val=p=>s.mode==="chest"?"🪙 "+p.v:p.v+T("px.masu");
    const easyR=ruleOf(s.rule)==="easy", allOk=ps.reduce((n,p)=>n+p.ok,0);
    const rowHtml=r=>`<div class="hrank ${r.i<=3?"t"+r.i:""}" data-pid="${esc(r.p.pid)}" role="button" tabindex="0"><b>${r.i}</b><span>${face(r.p.emoji)} ${esc(r.p.name)}</span><span>${val(r.p)}</span><span class="note">${T("px.ok",r.p.ok,r.t)}</span></div>`;
    /* 大画面には 上位3人の名前と点だけ（正解 n/m は出さない）。全員の表は「先生だけ みる」。やさしいルールは 名前つきの順位表を出さない */
    const topHtml=rows.slice(0,3).map(r=>`<div class="hrank ${"t"+r.i}" data-pid="${esc(r.p.pid)}" role="button" tabindex="0"><b>${r.i}</b><span>${face(r.p.emoji)} ${esc(r.p.name)}</span><span>${val(r.p)}</span></div>`).join("");
    px.innerHTML=`<div class="px-end"><h2 class="px-h2">${ic("flag")}${T("px.res")}<small>${T("px.avg",ps.length,avg)}</small></h2>
      <p class="px-more" style="font-size:34px;font-weight:800">${T("z.all",allOk)}</p>
      ${easyR?"":topHtml}<div id="pxto"></div></div>`;
    if(!easyR) $("#pxto").append(teacherOnly(h("div",{innerHTML:rows.slice(0,vis).map(rowHtml).join("")+(rows.length>vis?`<p class="px-more">${T("px.more",rows.length-vis)}</p>`:"")})));
  };
  const draw=s=>{
    last=s; HLAST=s; const m=modeOf(s), x=gameOf(s);
    if(s.mode==="quiz"&&s.status!=="lobby"){ kind="quiz"; qzHostDraw(s,()=>""); popStep(s); return; }
    if(s.mode==="rocket"&&s.status!=="lobby"){      // 協力モード：ロケットの大画面
      if(!document.getElementById("rocket-art")&&!B.artTry){ B.artTry=1; rkArt().catch(()=>{}).then(()=>{ if(last) draw(last); }); return; }      // 絵を読みこんでから作る
      const k2=s.status==="playing"?"rocket":"rkend";
      if(k2!==kind){ kind=k2; evs=[]; prev=null; dockSet(k2==="rocket"?"play":"rkend"); rkHostBuild(px,s); }
      rkHostUpd(s); rkPop(s); prev=s; return;
    }
    const k=s.status==="lobby"?"lobby":s.status==="playing"?s.mode:"end";
    if(k!==kind){ kind=k; evs=[]; prev=null; dockSet(k==="chest"||k==="race"?"play":k);
      if(k==="lobby") lobbyBuild(s); else if(k==="chest") chestBuild(s,m,x); else if(k==="race") raceBuild(s,m,x); else endBuild(s); }
    if(k==="lobby") lobbyUpd(s); else if(k==="chest") chestUpd(s); else if(k==="race") raceUpd(s);
    if(k==="chest"||k==="race"){
      pxEvents(s,prev,evs);
      const ev=document.getElementById("pxev");
      if(ev) ev.innerHTML=evs.length?evs.map((e,i)=>`<div class="e${i?"":" new"}">${e}</div>`).join(""):`<div class="e dim">${T("px.ev.none")}</div>`;
    }
    popStep(s);      // 画面を作ったあとで、吹き出しを出す（アイコンの場所が決まっている）
    prev=s;
  };
  listen(HOST.code,s=>{ off=s.now-Date.now(); draw(s); },()=>{ app.innerHTML=`<div class="q">部屋が見つかりません。<br><button class="btn" onclick="go('#teacher')">先生の画面へ</button></div>`; });   //T
  stopTimer();
  timerId=setInterval(()=>{ const t=document.getElementById("pxt");
    if(t&&last&&last.status==="playing"){ const n=Math.max(0,Math.ceil((last.endAt-off-Date.now())/1000)); t.textContent=clock(n); t.classList.toggle("warn",n<=10); }
    if(last&&last.mode==="quiz") qzHostTick(last,off); },250);
}

/* ================= ロケット はっしゃ（協力モード） =================
   流れ：問題タイムで燃料をためる → 目標でミニゲーム（全員同時）→ クリアで次のステージ（5つ）。進行と判定は data/cooplib.js（先生の端末と server.js で同じ部品）。
   児童の画面：問題・ブースト・ミニゲーム・自分の「できたこと」だけ（他の子の名前・正誤は出さない）。先生の大画面：ロケット・ゲージ・ステージ・良いことの名前の吹き出し */
const COOP=window.MH_COOP;
const RKMODE={id:"rocket",ico:"🚀"}; tget(RKMODE,"t","m.rocket.t"); tget(RKMODE,"d","m.rocket.d");
let RK=null, RKH=null;
const rkArt=()=>loadScript("data/rocket-art.js",()=>!!document.getElementById("rocket-art"));
const rkSvg=(id,vb,c)=>`<svg class="${c||"rks"}" viewBox="${vb}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
const rkNow=()=>Date.now()+RK.off;
function rkKidStop(){ stopTimer(); if(RK){ clearInterval(RK.fl); RK.fl=0; } }
function rkKidState(s){
  const co=COOP&&COOP.clean(s.co); if(!co) return;
  setLG(s.g);
  if(!RK||RK.code!==s.code) RK={code:s.code,offs:[],off:0,key:"",k:0,ans:0,ok:0,boo:0,hit:0,got:0,gotMini:0,pend:0,ended:false,art:0,cur:null,lock:false,boostSg:-1,pressed:{},fl:0,nextStar:0,flushing:false};
  const K=RK; K.s=s; K.co=co;
  const o=s.now-Date.now(); K.offs.push(o); if(K.offs.length>10) K.offs.shift(); K.off=Math.max(...K.offs);      // 先生の時計との差：遅れが一番小さかった状態から出す
  if(!K.art){ K.art=1; rkArt().catch(()=>{}).then(()=>{ if(RK===K) rkKidState(K.s); }); return; }
  if(s.status==="ended"||co.ph==="end") return rkKidEnd();
  const key=co.ph+":"+co.sg+":"+(co.mg?co.mg.k+co.mg.a:"");
  if(K.key!==key){ K.key=key; rkKidDraw(); } else rkKidLive();
}
function rkHead(){
  const K=RK, co=K.co;
  return `<div class="rk-hd"><span>🚀 ${T("rk.stage",co.sg+1)}</span><span class="note">${T("l.room")} ${esc(K.s.code)}</span></div>`;
}
const rkGaugeK=co=>`<div class="rk-kg"><span>${T("rk.fuel")}</span><div class="rk-hbar"><i id="rkg" style="width:${co.p}%"></i></div><b id="rkgp">${co.p}％</b></div>`;
function rkKidDraw(){
  const K=RK, co=K.co, m=co.mg; rkKidStop();
  if(co.ph==="count"){
    app.innerHTML=`<div class="play rkk">${rkHead()}<div class="q"><div>${T("n.soon")}</div><div class="countdown" id="rkcd"></div></div></div>`;
    const tick=()=>{ const c=$("#rkcd"); if(c) c.textContent=Math.max(0,Math.ceil((K.co.ae-rkNow())/1000)); };
    tick(); timerId=setInterval(tick,100);
  } else if(co.ph==="play"){
    const done=K.boostSg===co.sg;
    app.innerHTML=`<div class="play rkk">${rkHead()}${rkGaugeK(co)}<div class="rk-qh">${T("rk.q")}</div><div id="rkq"></div>
      <button type="button" class="btn rk-boost" id="rkb"${done?" disabled":""}>${rkSvg("rk-bolt","0 0 64 64","rks sm")}<span>${T(done?"rk.boosted":"rk.boost")}</span></button><div class="rk-sc">${T("rk.boost.h")}</div></div>`;
    $("#rkb").onclick=rkBoost; rkShowQ();
  } else if(co.ph==="mini"&&m.k==="sy"){
    app.innerHTML=`<div class="play rkk rkm">${rkHead()}<div class="q"><div class="big">${T("rk.sy")}</div><div class="small">${T("rk.sy.h")}</div></div>
      <div class="rk-rd" id="rkrd"></div><div class="rk-beat" id="rkbeat" aria-hidden="true"></div><div class="rk-hit" id="rkhit" aria-live="polite"></div>
      <button type="button" class="rk-press" id="rkpress">${rkSvg("rk-ring","0 0 64 64")}<span>${T("rk.press")}</span></button>
      <div class="rk-sc">${T("rk.class")}</div><div class="rk-hbar big"><i id="rkmp" style="width:${m.p}%"></i></div></div>`;
    $("#rkpress").onclick=rkPress; rkSyTick(); timerId=setInterval(rkSyTick,60);
  } else if(co.ph==="mini"){
    K.nextStar=0; K.gotMini=0;
    app.innerHTML=`<div class="play rkk rkm">${rkHead()}<div class="q"><div class="big">${T("rk.st")}</div><div class="small">${T("rk.st.h")}</div></div>
      <div class="rk-sc" id="rkcd2"></div><div class="rk-sky" id="rksky"></div><div class="rk-got">${rkSvg("rk-gem","0 0 48 48")}<span id="rkgot">${T("rk.got",0)}</span></div>
      <div class="rk-sc">${T("rk.class")}</div><div class="rk-hbar big star"><i id="rkmp" style="width:${m.p}%"></i></div></div>`;
    timerId=setInterval(rkStTick,100); K.fl=setInterval(rkFlush,400);
  } else if(co.ph==="again"){
    app.innerHTML=`<div class="play rkk">${rkHead()}<div class="q">${rkSvg("rk-rocket","0 0 120 150","rks big")}<div class="big">${T("rk.again")}</div><div class="small">${T("rk.again.h")}</div></div></div>`;
  } else if(co.ph==="clear"){
    sfx("medal"); party();
    app.innerHTML=`<div class="play rkk">${rkHead()}<div class="q">${rkSvg("rk-rocket","0 0 120 150","rks big")}<div class="big">${T("rk.clear",co.st)}</div><div class="small">${T("rk.reach",T("rk.dest",co.st-1))}</div></div></div>`;
  }
}
function rkKidLive(){
  const K=RK, co=K.co, g=$("#rkg"), p=$("#rkmp");
  if(g){ g.style.width=co.p+"%"; const t=$("#rkgp"); if(t) t.textContent=co.p+"％"; }
  if(p&&co.mg) p.style.width=co.mg.p+"%";
}
/* --- 問題タイム --- */
function rkLoadMine(){
  const K=RK; if(!NETSET_P) NETSET_P=api("set",NET).then(r=>{
    const c=QZ.cleanSet(r); const qs=c.ok?c.set.qs.filter(x=>x.t==="mc"):[];
    if(!qs.length) throw new Error("no set");
    MINE={qs,order:[],i:0};
  }).catch(()=>{ NETSET_P=null; });
  const box=$("#rkq"); if(box) box.innerHTML=`<div class="q">${T("rk.load")}</div>`;
  NETSET_P.then(()=>{ if(RK===K&&K.co.ph==="play"&&MINE) rkShowQ(); });
}
function rkShowQ(){
  const K=RK; if(!K||K.co.ph!=="play") return;
  const s=K.s, box=$("#rkq"); if(!box) return;
  if(s.game==="mine"&&!MINE) return rkLoadMine();
  const q=K.cur=(s.game==="mine"?genMine():genChoice(s.game,s.g)); K.lock=false;
  const cls=["ca","cb","cc","cd"];
  box.innerHTML=`<div class="q"><div class="big">${q.rich?"":esc(q.q)}${spkBtn(s.game,q.q)}</div><div class="small">${esc(q.small||"")}</div></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="choices">${q.ch.map((c,i)=>`<button class="choice ${cls[i]}" data-c="${esc(c)}"><span class="kh" aria-hidden="true">${i+1}</span>${q.rich?"":chLabel(c,q)}</button>`).join("")}</div>`;
  if(q.rich){ box.querySelector(".big").prepend(rubyNode(q.q)); box.querySelectorAll(".choice").forEach((b,i)=>b.append(rubyNode(q.ch[i]))); }
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>rkPick(b));
}
function rkPick(b){
  const K=RK; if(!K||K.lock||K.co.ph!=="play") return; K.lock=true;
  const q=K.cur, isOk=c=>q.rich?q.oks.includes(c):c===q.a, right=isOk(b.dataset.c);
  document.querySelectorAll("#rkq .choice").forEach(e=>e.classList.add(isOk(e.dataset.c)?"right":"wrong"));
  K.ans++; if(right) K.ok++;
  sfx(right?"ok":"ng");
  const fb=$("#fb"), ans=q.rich?QZ.plain(q.a):q.a;
  if(fb){ fb.className="fb "+(right?"ok":"ng"); fb.textContent=right?T("rk.right"):T("rk.wrong",ans); }
  api("act",{...NET,op:"cans",ok:right,k:++K.k}).then(r=>{
    if(RK===K&&r&&r.cap){ const f=$("#fb"); if(f){ f.className="fb ok"; f.textContent=T("rk.cap"); } }      // 1人の上限：数字は見せず「みんなの ばん！」
  }).catch(()=>{});
  setTimeout(()=>{ if(RK===K&&K.co.ph==="play") rkShowQ(); },right?1300:2600);      // 答えのあとは 1.3秒（まちがいは 2.6秒）あける
}
function rkBoost(){
  const K=RK; if(!K||K.co.ph!=="play"||K.boostSg===K.co.sg) return;
  K.boostSg=K.co.sg; K.boo++; sfx("ok");
  const b=$("#rkb"); if(b){ b.disabled=true; b.querySelector("span").textContent=T("rk.boosted"); }

async function runCheck(){

  const set=(i,st,msg)=>{ if(me.dead) return; $("#cki"+i).textContent=st; $("#ckm"+i).textContent=msg; };
  CK_STEPS.forEach((x,i)=>set(i,"⏳",i?"まだ調べていません":"調べています…"));
  $("#ckSum").innerHTML=""; $("#ckGo").disabled=true;
  const t0=performance.now(); let step=0, detail="";
  try{
    if(!window.RTCPeerConnection){ detail="このブラウザは WebRTC に対応していません"; step=2; throw new Error(detail); }

function pairShow(me){

    <div class="note" style="margin-top:6px">${ok?"対戦に十分な速さです。":"少しおそめです。対戦はできますが、動きがおくれることがあります。"}この2台は、同じ場所・同じネットワークなら友だち対戦が使えそうです（${esc(role)}）。</div></div>`;

/* つながったあと：おたがいに3回メッセージを送り、返事が来るまでの時間をはかる */
function pairRun(me,conn){
  const wait={};
  conn.on("data",m=>{
    if(!m||me.dead) return;
    if(m.ping!=null){ try{conn.send({pong:m.ping})}catch(e){} }
    if(m.pong!=null&&wait[m.pong]) wait[m.pong]();
    if(m.result!=null){ me.other=Math.max(0,Math.round(+m.result*10)/10||0); pairShow(me); }
  });
  conn.on("close",()=>{ if(!me.dead&&me.rtt==null&&!me.fail){ me.fail="相手の端末との接続が切れました"; pairShow(me); } });
  (async()=>{
    const rtts=[];
    for(let i=0;i<3;i++){
      const ts=performance.now();
      await withTimeout(new Promise(ok=>{ wait[i]=ok; conn.send({ping:i}); }),8000,"相手の端末から返事がありません");
      rtts.push(performance.now()-ts);
    }
    me.rtt=Math.round(rtts.reduce((a,b)=>a+b,0)/rtts.length*10)/10;
    try{ conn.send({result:me.rtt}); }catch(e){}
    pairShow(me);
  })().catch(e=>{ if(!me.dead){ me.fail=e.message; pairShow(me); } });
}

  const c=uCur(U.pool[U.pi++],U.choice); P.cur=c; P.inp={f:(c.len||[]).map(()=>""),at:0}; P.lock=false;
  if(c.mode==="choice4") P.chN++; else P.inN++;
  const qq=$("#qq"); qq.className="big"+(rbp(c.q).length>16?" long":""); qq.textContent=c.q;
  if(c.subj==="eigo") qq.insertAdjacentHTML("beforeend",spkBtn("eigo",c.q));
  $("#qs").textContent=c.small; $("#um").textContent=""; $("#um").insertAdjacentHTML("beforeend",uMarksHtml(P.marks,12));
  const area=$("#area");
  if(c.mode==="choice4"){
    const cls=["ca","cb","cc","cd"];
    area.innerHTML=`<div class="choices">${c.ch.map((x,i)=>`<button class="choice ${cls[i]}" data-c="${esc(x)}"><span class="kh" aria-hidden="true">${i+1}</span>${chLabel(x,c)}</button>`).join("")}</div>`;
    area.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>uPick(b));
    return;
  }
  const m=c.mode, dot=m==="dec"||(m==="unit"&&c.dot);
  const sp=m==="amari"?`<button data-k="あまり" class="sk">${T("u.amari")}</button>`:m==="frac"?`<button data-k="▶" class="sk ar" aria-label="${esc(T("u.nextf"))}">▶</button>`:dot?`<button data-k=".">.</button>`:"";
  const keys=["7","8","9","4","5","6","1","2","3"].map(k=>`<button data-k="${k}">${k}</button>`).join("")
    +(sp?sp+`<button data-k="0">0</button>`:`<button data-k="0" class="zero">0</button>`)+`<button data-k="⌫" aria-label="${esc(T("u.del"))}">⌫</button>`;
  const tail=m==="unit"?`<div class="unitrow">${c.units.map(u=>`<button data-u="${esc(u)}">${esc(UN.ruby?UN.ruby(u):u)}</button>`).join("")}</div>`
    :`<div class="pad" style="margin-top:8px"><button class="ok" data-k="OK" style="grid-column:span 3">${T("pad.ok")}</button></div>`;
  area.innerHTML=`<div class="uans" id="ans"></div><div class="pad">${keys}</div>${tail}`;
  area.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>uKey(b.dataset.k));
  area.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>uUnitTap(b.dataset.u));
  uShowInp();
}
function uShowInp(){
  const c=P.cur, I=P.inp, el=$("#ans"); if(!el||!c) return;
  const box=i=>h("span",{class:"ufld"+(I.at===i?" at":""),text:I.f[i]||" "});
  let kids;
  if(c.mode==="amari") kids=[box(0),h("span",{class:"ulab",text:T("u.amari")}),box(1)];
  else if(c.mode==="frac") kids=I.f.length===3?[box(0),h("span",{class:"ufrac"},box(1),h("i",{class:"ubar2"}),box(2))]:[h("span",{class:"ufrac"},box(0),h("i",{class:"ubar2"}),box(1))];
  else if(c.mode==="unit") kids=[box(0),h("span",{class:"ulab",text:T("u.pickunit")})];
  else kids=[box(0)];
  el.replaceChildren(...kids);
}
function uKey(k){
  if(!P||!P.u||P.lock||P.review||!P.cur) return;
  const c=P.cur, I=P.inp, m=c.mode; if(m==="choice4") return;
  if(k==="⌫"){ if(I.f[I.at]) I.f[I.at]=I.f[I.at].slice(0,-1); else if(I.at>0) I.at--; }
  else if(k==="OK") return uSubmit();
  else if(k==="あまり"){ if(m==="amari") I.at=1; }
  else if(k==="▶"){ if(I.at<I.f.length-1) I.at++; }
  else if(k==="."){ if((m==="dec"||(m==="unit"&&c.dot))&&!I.f[I.at].includes(".")&&I.f[I.at].length<7) I.f[I.at]=(I.f[I.at]||"0")+"."; }
  else if(/^\d$/.test(k)){
    const L=c.len[I.at]; let s=I.f[I.at];
    if(s.length<L){ s+=k; I.f[I.at]=s; }
    if(m!=="unit"&&s.length>=L){          // けたが そろったら、つぎの入力へ。さいごなら自動で判定（ネットレ方式）
      if(I.at<I.f.length-1) I.at++; else { uShowInp(); return uSubmit(); }
    }
  }
  uShowInp();
}
const uNorm=s=>String(s||"").replace(/^0+(?=\d)/,"");
function uSubmit(){
  const c=P.cur, f=P.inp.f, m=c.mode; let input;
  if(m==="num"||m==="dec"){ if(!f[0]) return; input=f[0].replace(/\.$/,""); }
  else if(m==="amari"){ if(!f[0]) return; input={q:uNorm(f[0]),r:uNorm(f[1]||"0")}; }
  else if(m==="frac"){ const k=f.length===3?1:0; if(!f[k]||!f[k+1]||/^0+$/.test(f[k+1])) return; input={w:k?uNorm(f[0]||"0"):0,n:uNorm(f[k]),d:uNorm(f[k+1])}; }
  else return;
  uJudge(UN.check(c.u,input));
}
function uUnitTap(un){
  if(!P||!P.u||P.lock||!P.cur||P.cur.mode!=="unit") return;
  const f=P.inp.f[0]; if(!f) return;
  uJudge(UN.check(P.cur.u,{num:uNorm(f.replace(/\.$/,"")),unit:un}));
}
function uPick(b){
  if(!P||P.lock||b.disabled) return;
  const right=b.dataset.c===P.cur.a;
  if(right) $("#area").querySelectorAll(".choice").forEach(e=>{ if(e.dataset.c===P.cur.a) e.classList.add("right"); else e.classList.add("wrong"); });
  else { b.classList.add("wrong"); b.disabled=true; }
  uJudge(right);
}
/* ○△×：1回目で正解＝○、1回まちがえて正解＝△、2回まちがえたら×（答えを見せて次へ） */
function uJudge(right){
  const p=P, c=p.cur, fb=$("#fb"); p.lock=true;
  sfx(right?"ok":"ng");
  let mark, wait;
  if(right){
    mark=c.tries===0?"○":"△";
    if(mark==="○"){ p.ok++; fb.className="fb ok"; fb.textContent=T("fb.ok"); wait=350; }
    else { p.ng++; p.misses.push(`${c.q} → ${c.a}`); p.missObjs.push(c); fb.className="fb ok"; fb.textContent=T("u.ok2"); wait=700; }
  } else {
    c.tries++;
    if(c.tries<2){ fb.className="fb ng"; fb.textContent=T("u.retry"); p.inp={f:(c.len||[]).map(()=>""),at:0}; if(c.mode!=="choice4") uShowInp(); p.lock=false; return; }
    mark="×"; p.ng++; p.misses.push(`${c.q} → ${c.a}`); p.missObjs.push(c);
    fb.className="fb ng"; fb.textContent=T("fb.ng",c.a); wait=1700;
    if(c.mode==="choice4") $("#area").querySelectorAll(".choice").forEach(e=>{ if(e.dataset.c===c.a) e.classList.add("right"); else e.classList.add("wrong"); });
  }
  p.marks.push(mark); $("#um").innerHTML=uMarksHtml(p.marks,12);
  p.uSt=p.uSt||{}; const us=p.uSt[c.uid]=p.uSt[c.uid]||{n:0,o:0}; us.n++; if(mark==="○") us.o++;
  $("#sc").textContent=p.ok;
  setTimeout(()=>{ if(P!==p) return; if(p.left>0&&timerId){ fb.className="fb"; fb.textContent=""; unitNext(); } },wait);
}
function uKeydown(e){
  const c=P.cur;
  if(c.mode==="choice4"){ if(/^[1-4]$/.test(e.key)){ const b=$("#area").querySelectorAll(".choice")[+e.key-1]; if(b) uPick(b); } return; }
  if(/^[0-9]$/.test(e.key)) uKey(e.key);
  else if(e.key==="."||e.key===",") uKey(".");
  else if(e.key==="Backspace") uKey("⌫");
  else if(e.key==="Enter") uKey("OK");
}
