<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まなびひろば</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#23303b; --muted:#6c7782; --line:#e3ddd0;
  --main:#2f7d5b; --main2:#e8f4ee; --accent:#f2a33a;
  --math:#e2643f; --jp:#3d7bd9; --soc:#2f9d6a; --eng:#9a5bd0;
  --a:#e04c4c; --b:#2f7fd9; --c:#e3a21a; --d:#2fa565;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif}
a{color:var(--main)}
button{font-family:inherit}
header{background:var(--main);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{font-size:22px;font-weight:bold;cursor:pointer;letter-spacing:.05em}
header .medals{margin-left:auto;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;font-size:15px}
header .tbtn{background:#fff;color:var(--main);border:0;border-radius:20px;padding:7px 14px;font-weight:bold;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:20px 0 10px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{border:2px solid var(--line);background:#fff;border-radius:22px;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:bold}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.game{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:transform .1s, box-shadow .1s}
.game:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.game .ico{font-size:40px}
.game .t{font-size:18px;font-weight:bold}
.game .d{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;color:#fff;border-radius:6px;padding:2px 8px;margin-right:4px}
.stars{color:var(--accent);font-size:14px}
.empty{color:var(--muted);padding:20px;text-align:center;background:#fff;border-radius:12px;border:2px dashed var(--line)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.link{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink)}
.link b{display:block;margin-bottom:4px}
.link span{font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.banner{background:#fff6e3;border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:12px}
/* プレイ画面 */
.play{max-width:640px;margin:0 auto;text-align:center}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.back{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:15px}
.timer{font-size:22px;font-weight:bold}
.tbar{height:10px;background:#e7e1d4;border-radius:5px;overflow:hidden;margin-bottom:14px}
.tbar>i{display:block;height:100%;background:var(--main);width:100%;transition:width .2s linear}
.q{background:#fff;border-radius:18px;border:2px solid var(--line);padding:26px 12px;margin-bottom:14px}
.q .big{font-size:clamp(34px,9vw,60px);font-weight:bold;line-height:1.25}
.q .small{color:var(--muted);margin-top:6px}
.answer{font-size:40px;font-weight:bold;min-height:56px;border-bottom:3px solid var(--main);display:inline-block;min-width:160px;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto}
.pad button{font-size:28px;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}
.pad button.ok{background:var(--main);color:#fff;border-color:var(--main)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{font-size:clamp(18px,4.5vw,26px);padding:18px 8px;border-radius:14px;border:0;color:#fff;cursor:pointer;font-weight:bold;min-height:72px}
.ca{background:var(--a)} .cb{background:var(--b)} .cc{background:var(--c)} .cd{background:var(--d)}
.choice.wrong{opacity:.35} .choice.right{outline:5px solid #222}
.score{font-size:15px;color:var(--muted);margin-top:12px}
.fb{height:30px;font-size:22px;font-weight:bold;margin-top:6px}
.fb.ok{color:var(--d)} .fb.ng{color:var(--a)}
/* 結果 */
.res{background:#fff;border-radius:18px;border:2px solid var(--line);padding:22px}
.medal{font-size:70px;line-height:1}
.res .num{font-size:44px;font-weight:bold;color:var(--main)}
.res table{margin:12px auto;border-collapse:collapse;font-size:16px}
.res td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:left}
.res td:last-child{text-align:right;font-weight:bold}
.btn{display:inline-block;background:var(--main);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:bold;cursor:pointer;margin:6px}
.btn.sub{background:#fff;color:var(--main);border:2px solid var(--main)}
.miss{font-size:14px;text-align:left;background:#faf7f0;border-radius:10px;padding:10px 14px;margin-top:10px}
/* 先生 */
.form{background:#fff;border-radius:14px;border:2px solid var(--line);padding:16px;display:grid;gap:12px}
.form label{display:grid;gap:6px;font-weight:bold;font-size:15px}
.form select{font-size:16px;padding:8px;border-radius:8px;border:2px solid var(--line);font-family:inherit}
.out{background:#f1f7f3;border:2px solid var(--main);border-radius:10px;padding:10px;word-break:break-all;font-size:14px}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
/* 教室で映す */
.proj{position:fixed;inset:0;background:#1d2a33;color:#fff;display:flex;flex-direction:column;padding:24px;z-index:10}
.proj .ptop{display:flex;justify-content:space-between;font-size:22px}
.proj .pq{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,96px);font-weight:bold;text-align:center}
.proj .pc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.proj .pc div{font-size:clamp(22px,3.5vw,40px);padding:22px;border-radius:14px;font-weight:bold}
.proj .pc div.dim{opacity:.25}
.proj .pbtns{text-align:center;margin-top:16px}
.proj .count{font-size:48px;font-weight:bold;color:var(--accent)}
/* バトルモード */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mode{background:linear-gradient(135deg,#fff,#fff6e3);border:2px solid var(--accent);border-radius:16px;padding:14px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center}
.mode .ico{font-size:48px}
.mode .t{font-size:19px;font-weight:bold;display:block}
.mode .d{font-size:13px;color:var(--muted)}
.mplay{max-width:980px;margin:0 auto}
.mgrid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}}
.side{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.side h3{margin:0 0 8px;font-size:16px}
.rank{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;margin-bottom:6px;background:#faf7f0;font-size:16px;transition:background .3s}
.rank.me{background:#e8f4ee;font-weight:bold}
.rank .v{margin-left:auto;font-weight:bold}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.box{font-size:64px;background:#fff;border:3px solid var(--accent);border-radius:18px;padding:18px 0;cursor:pointer;transition:transform .15s}
.box:hover{transform:translateY(-4px) rotate(-3deg)}
.box.open{cursor:default;transform:none;font-size:22px;font-weight:bold;padding:30px 4px;background:#fff6e3}
.box.dim{opacity:.35}
.msg{font-size:24px;font-weight:bold;min-height:36px;margin:8px 0}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cell{position:relative;background:#faf7f0;border-radius:8px;min-height:40px;font-size:11px;color:var(--muted);padding:2px 3px;text-align:left}
.cell.ev{background:#fff6e3}
.cell.goal{background:#ffe7a8;font-weight:bold;color:var(--ink)}
.cell .tk{position:absolute;bottom:1px;right:2px;font-size:16px;letter-spacing:-4px}
.dice{font-size:80px;margin:10px 0;display:inline-block}
.dice.roll{animation:roll .5s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.pill.small{padding:6px 12px;font-size:14px}
/* 友だち対戦 */
.bigcode{font-size:clamp(56px,14vw,120px);font-weight:bold;letter-spacing:.15em;color:var(--main);font-family:ui-monospace,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:#fff;border:2px solid var(--line);border-radius:20px;padding:6px 12px;font-size:16px}
.digits{display:flex;gap:10px;justify-content:center;margin:12px 0}
.digit{width:60px;height:72px;border:3px solid var(--line);border-radius:12px;background:#fff;font-size:40px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.digit.on{border-color:var(--main)}
.err{color:var(--a);font-weight:bold;min-height:24px}
.hrank{display:grid;grid-template-columns:50px 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:#fff;margin-bottom:6px;border:2px solid var(--line);font-size:18px}
.hrank b{font-size:22px}
.rtable{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
.rtable th,.rtable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.rtable th{background:var(--main2)}
.countdown{font-size:120px;font-weight:bold;color:var(--main)}
</style>
</head>
<body>
<header>
  <span class="logo" onclick="go('#home')">🌱 まなびひろば</span>
  <span class="medals" id="medalCount">🏅 0</span>
  <button class="tbtn" onclick="go('#join')">🔑 コードで参加</button>
  <button class="tbtn" onclick="go('#teacher')">先生の画面</button>
</header>

<main class="wrap" id="app"></main>

<!-- 問題データ（file:// でも読めるよう script タグで読む） -->
<script src="data/questions.js"></script>
<script src="data/calc.js"></script>
<script>
/* ================= データ ================= */
const SUBJ={math:{n:"算数",c:"var(--math)"},jp:{n:"国語",c:"var(--jp)"},soc:{n:"社会",c:"var(--soc)"},eng:{n:"英語",c:"var(--eng)"}};
const DATA_OK=!!(window.MH_QUESTIONS&&window.MH_CALC);
const QD=window.MH_QUESTIONS||{kanji:[],kencho:[],eigo:[]};
/* 漢字は学年ごとに分けておく（1問 = {id,g,q,a}） */
const KANJI={}; for(const x of QD.kanji) (KANJI[x.g]=KANJI[x.g]||[]).push(x);
const KENCHO=QD.kencho, EIGO=QD.eigo;


/* ゲーム一覧（自分で作るゲーム） */
const GAMES=[
 {id:"calc",ico:"🧮",t:"計算スプリント",d:"時間内に何問とけるかな？学年に合わせた計算",s:"math",g:[1,2,3,4,5,6],type:"input"},
 {id:"kuku",ico:"✖️",t:"九九チャレンジ",d:"九九をすばやく答えよう",s:"math",g:[2,3],type:"input"},
 {id:"kanji",ico:"📖",t:"漢字よみクイズ",d:"漢字の読みを4つから選ぼう",s:"jp",g:[1,2,3,4,5,6],type:"choice"},
 {id:"kencho",ico:"🗾",t:"県庁所在地クイズ",d:"都道府県の県庁がある市は？",s:"soc",g:[4,5,6],type:"choice"},
 {id:"eigo",ico:"🔤",t:"英単語クイズ",d:"英語の意味を選ぼう",s:"eng",g:[5,6],type:"choice"}
];
/* ほかの学習サイト（紹介とリンクのみ） */
const LINKS=[
 {t:"寿司打",u:"https://sushida.net/",d:"回転ずしのタイピングゲーム"},
 {t:"Kahoot!（参加用）",u:"https://kahoot.it/",d:"先生のクイズに参加するときに使うページ"},
 {t:"NHK for School",u:"https://www.nhk.or.jp/school/",d:"教科ごとの学習動画"}
];

/* ================= 共通 ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function params(){ const [p,q]=location.hash.slice(1).split("?"); return {path:p||"home",q:new URLSearchParams(q||"")}; }
let ui=store.get("mh_ui",{grade:0,subj:"all"});
let timerId=0;
function stopTimer(){ clearInterval(timerId); timerId=0; }
function bests(){ return store.get("mh_best",{}); }
function medalTotal(){ return Object.values(bests()).reduce((n,b)=>n+(b.medal||0),0); }
function refreshMedals(){ $("#medalCount").textContent="🏅 "+medalTotal(); }

/* ================= 問題を作る ================= */
/* 計算は data/calc.js で学年の単元に合わせて作る（分数の学年は4択になる） */
function makeCalc(g){ return window.MH_CALC.make(g,rnd,shuffle); }
function makeKuku(){ const a=1+rnd(9),b=1+rnd(9); return {q:`${a} × ${b}`,a:a*b}; }
function makeChoice(list,small){
  const item=list[rnd(list.length)];
  const others=shuffle([...new Set(list.filter(x=>x.a!==item.a).map(x=>x.a))]).slice(0,3);
  return {id:item.id,q:item.q,a:item.a,ch:shuffle([item.a,...others]),small};
}
function gen(id,g){
  if(id==="calc") return makeCalc(g);
  if(id==="kuku") return makeKuku();
  if(id==="kanji") return makeChoice(KANJI[g]||KANJI[1],"この漢字の読みは？");
  if(id==="kencho") return makeChoice(KENCHO,"県庁所在地は？");
  if(id==="eigo") return makeChoice(EIGO,"意味は？");
}

/* ================= ホーム ================= */
function renderHome(){
  const b=bests();
  const list=GAMES.filter(x=>(ui.grade===0||x.g.includes(ui.grade))&&(ui.subj==="all"||x.s===ui.subj));
  app.innerHTML=`
    <button class="btn" id="quick" style="width:100%;margin:12px 0 0;font-size:22px;padding:18px">⚡ 1分であそぶ（すぐスタート）</button>
    <p class="note" style="text-align:center">あいた時間にワンタップ。学年に合ったゲームをえらんで始めます</p>
    <h2>何年生？</h2>
    <div class="pills">${[0,1,2,3,4,5,6].map(g=>`<button class="pill ${ui.grade===g?"on":""}" data-g="${g}">${g?g+"年":"ぜんぶ"}</button>`).join("")}</div>
    <h2>教科</h2>
    <div class="pills">${[["all","ぜんぶ"],...Object.entries(SUBJ).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="pill ${ui.subj===k?"on":""}" data-s="${k}">${n}</button>`).join("")}</div>
    <h2>あそべるゲーム</h2>
    ${list.length?`<div class="games">${list.map(x=>{
      const best=b[x.id]; const st=best?"★".repeat(best.medal)+"☆".repeat(3-best.medal):"☆☆☆";
      return `<button class="game" data-id="${x.id}">
        <span class="ico">${x.ico}</span><span class="t">${x.t}</span>
        <span><span class="tag" style="background:${SUBJ[x.s].c}">${SUBJ[x.s].n}</span><span class="note">${x.g[0]}〜${x.g[x.g.length-1]}年</span></span>
        <span class="d">${x.d}</span><span class="stars">${st}</span></button>`}).join("")}</div>`
      :`<div class="empty">この学年・教科のゲームはじゅんび中です</div>`}
    <h2>🎮 バトルモード（2〜3分）</h2>
    <p class="note" style="margin-top:-4px">同じ問題を、ちがう遊び方で。コンピューターの3人とたいせん！</p>
    <div class="modes">${MODES.map(m=>`<button class="mode" data-m="${m.id}"><span class="ico">${m.ico}</span><span><span class="t">${m.t}</span><span class="d">${m.d}</span></span></button>`).join("")}</div>
    <h2>ほかの学習サイト</h2>
    <div class="links">${LINKS.map(l=>`<a class="link" href="${l.u}" target="_blank" rel="noopener"><b>${esc(l.t)} ↗</b><span>${esc(l.d)}</span></a>`).join("")}</div>
    <p class="note">※ ほかのサイトは紹介のみです。学校で使えるかどうかは先生に聞いてね。</p>
    <p class="note" style="text-align:center;margin-top:20px"><a href="#check">🔌 接続テスト（先生・ICT担当の方へ）</a></p>`;
  $("#quick").onclick=()=>{
    const pool=GAMES.filter(x=>ui.grade===0||x.g.includes(ui.grade));
    const x=pool[rnd(pool.length)]; const g=x.g.includes(ui.grade)?ui.grade:x.g[0];
    go(`#play?game=${x.id}&g=${g}&t=60`);
  };
  app.querySelectorAll("[data-g]").forEach(e=>e.onclick=()=>{ui.grade=+e.dataset.g;store.set("mh_ui",ui);renderHome()});
  app.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{ui.subj=e.dataset.s;store.set("mh_ui",ui);renderHome()});
  app.querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>{
    const x=GAMES.find(y=>y.id===e.dataset.id);
    const g=x.g.includes(ui.grade)?ui.grade:x.g[0];
    go(`#play?game=${x.id}&g=${g}&t=60`);
  });
  app.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>go(`#modesetup?m=${e.dataset.m}`));
}

/* ================= プレイ ================= */
let P=null;
function renderPlay(q){
  const x=GAMES.find(y=>y.id===q.get("game")); if(!x) return go("#home");
  let g=+q.get("g")||x.g[0]; if(!x.g.includes(g)) g=x.g[0];
  const t=Math.min(300,Math.max(20,+q.get("t")||60));
  const task=q.get("task")==="1";
  P={x,g,t,left:t,ok:0,ng:0,cur:null,inp:"",misses:[],task,lock:false};
  app.innerHTML=`<div class="play">
    ${task?`<div class="banner">📝 先生からの課題：${x.t}（${g}年・${t}秒）</div>`:""}
    <div class="topbar">
      <button class="back" onclick="stopTimer();go('#home')">← もどる</button>
      <span><b>${x.ico} ${x.t}</b> <span class="note">${g}年</span></span>
      <span class="timer" id="tm">${t}</span>
    </div>
    ${x.g.length>1&&!task?`<div class="pills" style="justify-content:center">${x.g.map(n=>`<button class="pill ${n===g?"on":""}" data-g="${n}">${n}年</button>`).join("")}</div>`:""}
    <div class="tbar"><i id="tb"></i></div>
    <div class="q"><div class="big" id="qq"></div><div class="small" id="qs"></div></div>
    <div id="area"></div>
    <div class="fb" id="fb"></div>
    <div class="score">せいかい <b id="sc">0</b> 問</div>
  </div>`;
  app.querySelectorAll("[data-g]").forEach(e=>e.onclick=()=>go(`#play?game=${x.id}&g=${e.dataset.g}&t=${t}`));
  next();
  stopTimer();
  const end=Date.now()+t*1000;
  timerId=setInterval(()=>{
    P.left=Math.max(0,(end-Date.now())/1000);
    $("#tm").textContent=Math.ceil(P.left); $("#tb").style.width=(P.left/t*100)+"%";
    if(P.left<=0){ stopTimer(); finish(); }
  },100);
}
function next(){
  P.cur=gen(P.x.id,P.g); P.inp=""; P.lock=false;
  $("#qq").textContent=P.cur.q; $("#qs").textContent=P.cur.small||"= ?";
  const area=$("#area");
  if(!P.cur.ch){
    area.innerHTML=`<div class="answer" id="ans">&nbsp;</div>
      <div class="pad">${["7","8","9","4","5","6","1","2","3",".","0","⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}
      <button class="ok" data-k="OK" style="grid-column:span 3">こたえる</button></div>`;
    area.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
  } else {
    const cls=["ca","cb","cc","cd"];
    area.innerHTML=`<div class="choices">${P.cur.ch.map((c,i)=>`<button class="choice ${cls[i]}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    area.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>pick(b));
  }
}
function key(k){
  if(!P||P.lock) return;
  if(k==="⌫") P.inp=P.inp.slice(0,-1);
  else if(k==="OK"){ if(P.inp!=="") judge(parseFloat(P.inp)===P.cur.a, P.cur.a); return; }
  else if(P.inp.length<7) P.inp+=k;
  $("#ans").innerHTML=P.inp?esc(P.inp):"&nbsp;";
}
function pick(b){
  if(P.lock) return;
  const right=b.dataset.c===P.cur.a;
  $("#area").querySelectorAll(".choice").forEach(e=>{ if(e.dataset.c===P.cur.a) e.classList.add("right"); else e.classList.add("wrong"); });
  judge(right,P.cur.a);
}
function judge(right,ans){
  P.lock=true;
  const fb=$("#fb");
  if(right){ P.ok++; fb.className="fb ok"; fb.textContent="⭕ せいかい！"; }
  else { P.ng++; P.misses.push(`${P.cur.q} → ${ans}`); fb.className="fb ng"; fb.textContent=`❌ こたえは ${ans}`; }
  $("#sc").textContent=P.ok;
  setTimeout(()=>{ if(P&&P.left>0&&timerId){ fb.textContent=""; next(); } }, right?350:1100);
}
function finish(){
  const p=P; P.lock=true;
  const total=p.ok+p.ng, acc=total?Math.round(p.ok/total*100):0;
  const per=p.ok*60/p.t;                       // 1分あたりの正解数
  const goal=p.x.type==="input"?[8,14,20]:[6,10,14];
  const medal=per>=goal[2]&&acc>=80?3:per>=goal[1]?2:per>=goal[0]?1:0;
  const all=bests(), key=p.x.id, prev=all[key]||{score:0,medal:0};
  const isNew=p.ok>prev.score && !p.task;
  all[key]={score:Math.max(prev.score,p.ok),medal:Math.max(prev.medal,medal)};
  store.set("mh_best",all); refreshMedals();
  const report=`【${p.x.t}】${p.g}年 ${p.t}秒｜せいかい${p.ok}問／${total}問（正答率${acc}%）`;
  app.innerHTML=`<div class="play"><div class="res">
    <div class="medal">${["🙂","🥉","🥈","🥇"][medal]}</div>
    <div class="num">${p.ok} 問 せいかい</div>
    ${isNew?`<div style="color:var(--accent);font-weight:bold">★ 自己ベスト更新！</div>`:""}
    <table><tr><td>答えた数</td><td>${total} 問</td></tr><tr><td>正答率</td><td>${acc}%</td></tr><tr><td>自己ベスト</td><td>${all[key].score} 問</td></tr></table>
    ${p.misses.length?`<div class="miss"><b>まちがえた問題（ふくしゅうしよう）</b><br>${p.misses.slice(0,8).map(esc).join("<br>")}</div>`:""}
    ${p.task?`<div class="miss"><b>先生に送る結果</b><br><span id="rep">${esc(report)}</span><br><button class="btn sub" id="cp">コピーする</button></div>`:""}
    <div><button class="btn" id="again">もう一回</button><button class="btn sub" onclick="go('#home')">ほかのゲーム</button></div>
  </div></div>`;
  $("#again").onclick=()=>route();
  const cp=$("#cp"); if(cp) cp.onclick=()=>{ navigator.clipboard?.writeText(report).then(()=>cp.textContent="コピーしました",()=>{}); };
}
document.addEventListener("keydown",e=>{
  if(!P||!timerId||!P.cur) return;
  if(!P.cur.ch){
    if(/^[0-9.]$/.test(e.key)) key(e.key);
    else if(e.key==="Backspace") key("⌫");
    else if(e.key==="Enter") key("OK");
  } else if(/^[1-4]$/.test(e.key)){
    const b=$("#area").querySelectorAll(".choice")[+e.key-1]; if(b) pick(b);
  }
});

/* ================= 教室で映す ================= */
function startProjector(id,g,n,sec){
  const x=GAMES.find(y=>y.id===id);
  const qs=[]; const seen=new Set();
  for(let i=0;qs.length<n&&i<200;i++){ const q=gen(id,g); if(!seen.has(q.q)){seen.add(q.q);qs.push(q);} }
  const el=document.createElement("div"); el.className="proj"; document.body.appendChild(el);
  let i=0, tid=0;
  const cols=["var(--a)","var(--b)","var(--c)","var(--d)"], lab=["A","B","C","D"];
  const close=()=>{clearInterval(tid); el.remove();};
  function show(){
    const q=qs[i]; let left=sec;
    const draw=(reveal)=>{
      el.innerHTML=`<div class="ptop"><span>${x.ico} ${x.t}（${g}年）</span><span>${i+1} / ${qs.length}</span><span class="count">${reveal?"":left}</span></div>
        <div class="pq"><div>${esc(q.q)}<div style="font-size:.35em;opacity:.7;margin-top:10px">${esc(q.small||"")}</div></div></div>
        <div class="pc">${q.ch.map((c,k)=>`<div class="${reveal&&c!==q.a?"dim":""}" style="background:${cols[k]}">${lab[k]}. ${esc(c)}${reveal&&c===q.a?" ⭕":""}</div>`).join("")}</div>
        <div class="pbtns">${reveal
          ?(i<qs.length-1?`<button class="btn" id="nx">次の問題 →</button>`:`<button class="btn" id="fin">おわり</button>`)
          :`<button class="btn sub" id="rv">答えを見せる</button>`}
          <button class="btn sub" id="cl">とじる</button></div>`;
      el.querySelector("#cl").onclick=close;
      const rv=el.querySelector("#rv"); if(rv) rv.onclick=()=>{clearInterval(tid);draw(true)};
      const nx=el.querySelector("#nx"); if(nx) nx.onclick=()=>{i++;show()};
      const fin=el.querySelector("#fin"); if(fin) fin.onclick=close;
    };
    draw(false);
    clearInterval(tid);
    tid=setInterval(()=>{ left--; if(left<=0){clearInterval(tid);draw(true);} else { const c=el.querySelector(".count"); if(c) c.textContent=left; } },1000);
  }
  show();
}

/* ================= バトルモード（Blooket型：同じ問題をいろいろな遊び方で） ================= */
const MODES=[
 {id:"chest",ico:"🎁",t:"たからばこラッシュ",d:"正解するとたからばこを1つ開けられる。コインを一番集めた人の勝ち！"},
 {id:"race",ico:"🎲",t:"すごろくレース",d:"正解するとサイコロをふれる。先にゴールした人の勝ち！"}
];
const BOTS=[{n:"パンダ",e:"🐼"},{n:"ウサギ",e:"🐰"},{n:"カエル",e:"🐸"}];
/* ルール：やさしい＝たからばこで「うばう・入れかえ・落とす」が出ない／すごろくに🌀（もどる）がない */
const RULES=[{id:"normal",t:"ふつう",d:"うばう・入れかえ・もどる もある"},{id:"easy",t:"やさしい",d:"コインがへらない・もどらない"}];
const ruleOf=v=>v==="easy"?"easy":"normal";
const ruleName=v=>ruleOf(v)==="easy"?"やさしいルール":"ふつうのルール";
const defaultRule=g=>g===1||g===2?"easy":"normal";   // 1〜2年は「やさしい」が初期値
function evOf(rule){ if(ruleOf(rule)!=="easy") return EV; const e={}; for(const k in EV) if(EV[k]!=="🌀") e[k]=EV[k]; return e; }
const rr=(a,b)=>a+Math.random()*(b-a);

/* 計算問題も4択にする（タブレットで押しやすく） */
function genChoice(id,g){
  const q=gen(id,g); if(q.ch) return q;
  const a=q.a, dec=(String(a).split(".")[1]||"").length, step=Math.pow(10,-dec), c=new Set();
  for(const o of shuffle([1,2,3,10,-1,-2,-3,-10])){ const v=+(a+o*step).toFixed(dec); if(v>=0&&v!==a) c.add(v); if(c.size>=3) break; }
  return {q:q.q,a:String(a),ch:shuffle([a,...c].map(String)),small:"= ?"};
}

/* --- ごほうび（モードごと） --- */
function reward(){ M.phase="reward"; if(M.m.id==="chest") chestReward(); else raceReward(); }

function chestReward(){
  $("#mmain").innerHTML=`<div class="q" style="padding:16px"><div style="font-size:20px;font-weight:bold">たからばこを1つえらんでね</div>
    <div class="boxes">${[0,1,2].map(i=>`<button class="box" data-b="${i}">🎁</button>`).join("")}</div><div class="msg" id="msg"></div></div>`;
  $("#mmain").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>openBox(b));
}
function rollChest(rule){
  const T=ruleOf(rule)==="easy"
    ?[["+10",24],["+20",26],["+30",18],["+50",12],["x2",8],["none",2]]          // やさしい：増えるか からっぽ だけ
    :[["+10",20],["+20",22],["+30",16],["+50",10],["x2",8],["lose",8],["steal",10],["swap",4],["none",2]];
  let r=Math.random()*T.reduce((n,x)=>n+x[1],0); for(const [k,w] of T){ if((r-=w)<0) return k; } return "+10";
}
function openBox(btn){
  if(M.phase!=="reward") return; M.phase="wait";
  if(M.net) return netBox(rollChest(M.rule),btn);
  const k=rollChest(M.rule), L=leaderBot(); let label, msg;
  if(k[0]==="+"){ const n=+k.slice(1); M.me.v+=n; label=`🪙 +${n}`; msg=`コイン ${n} まいゲット！`; }
  else if(k==="x2"){ M.me.v*=2; label="✨ 2ばい"; msg="コインが2ばいになった！"; }

/* ================= 友だち対戦（サーバー接続） ================= */
/* 通信の方式
   p2p（標準）：先生の端末がサーバー役。端末どうしは WebRTC で直接つながる。最初の仲介だけ PeerJS の公開サーバーを使う
   server（予備）：URL に ?net=server をつけると node server.js 経由で動く */
const isServer=location.protocol.startsWith("http");
const NETMODE=/[?&]net=server/.test(location.search)?"server":"p2p";
const netOK=NETMODE==="p2p"||isServer;
let ES=null, NET=null, HOST=null;
const sget=k=>{try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}};
const sset=(k,v)=>{try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,ng)=>setTimeout(()=>ng(new Error(msg)),ms))]);

/* ---- 予備：対戦用サーバー経由 ---- */
async function srvApi(name,body){
  const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:"通信エラー"}));
  if(!r.ok) throw new Error(j.error||"通信エラー");
  return j;
}
function srvListen(code,onState,onLost){
  const es=new EventSource("/api/events?code="+encodeURIComponent(code));
  es.onmessage=e=>onState(JSON.parse(e.data));
  es.onerror=()=>{ if(es.readyState===2) onLost(); };
  return es;
}

/* ---- 標準：先生の端末がサーバー役（P2P） ---- */
const PEER_PREFIX="manabihiroba-v1-";
let peerP=null;
function loadPeer(){
  if(window.Peer) return Promise.resolve();
  if(!peerP) peerP=new Promise((ok,ng)=>{
    const s=document.createElement("script"); s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
    s.onload=ok; s.onerror=()=>{peerP=null; ng(new Error("通信の部品を読み込めませんでした（ネット接続を確認してください）"));};
    document.head.appendChild(s);
  });
  return peerP;
}
const rid=()=>{const a=new Uint8Array(9);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")};
const NICK_ADJ=["はやい","かしこい","げんきな","つよい","やさしい","ひかる","ふしぎな","まじめな","すごい","のんびり"];
const NICK_ANI=[["パンダ","🐼"],["ウサギ","🐰"],["カエル","🐸"],["ネコ","🐱"],["イヌ","🐶"],["キツネ","🦊"],["コアラ","🐨"],["ペンギン","🐧"],["トラ","🐯"],["ライオン","🦁"],["タコ","🐙"],["ヒヨコ","🐤"]];

/* 先生の端末で動く「部屋」 */
let HR=null;
function hrPub(r){
  return {code:r.code,mode:r.mode,game:r.game,g:r.g,t:r.t,rule:r.rule,status:r.status,endAt:r.endAt,now:Date.now(),
    players:[...r.players.values()].map(p=>({pid:p.pid,name:p.name,emoji:p.emoji,v:p.v,ok:p.ok,ng:p.ng}))};
}
function hrBroadcast(r,now){
  const send=()=>{ r.timer=null; const s=hrPub(r);
    for(const c of r.conns){ try{c.send({type:"state",s})}catch(e){} }
    for(const f of r.listeners) f(s); };
  if(now){ clearTimeout(r.timer); return send(); }
  if(!r.timer) r.timer=setTimeout(send,150);
}
function hrEnd(r){ if(r.status==="ended") return; r.status="ended"; hrBroadcast(r,true); }
function hrNick(r){
  const used=new Set([...r.players.values()].map(p=>p.name));
  for(let i=0;i<80;i++){ const [n,e]=NICK_ANI[rnd(NICK_ANI.length)], name=NICK_ADJ[rnd(NICK_ADJ.length)]+n; if(!used.has(name)) return {name,emoji:e}; }
  return {name:"なかま"+(100+rnd(900)),emoji:"🙂"};
}
function hrApi(r,name,b){
  const pl=()=>{const p=r.players.get(b.pid); return p&&p.token===b.token?p:null;};
  if(name==="join"){
    if(r.status==="ended") return [409,{error:"この対戦はもう終わっています"}];
    if(r.players.size>=60) return [409,{error:"部屋がいっぱいです"}];
    const p={pid:rid(),token:rid(),...hrNick(r),v:0,ok:0,ng:0}; r.players.set(p.pid,p); hrBroadcast(r);
    return [200,{code:r.code,pid:p.pid,token:p.token,name:p.name,emoji:p.emoji}];
  }
  if(name==="reroll"){ const p=pl(); if(!p||r.status!=="lobby") return [409,{error:"今は変えられません"}];
    Object.assign(p,hrNick(r)); hrBroadcast(r); return [200,{name:p.name,emoji:p.emoji}]; }
  if(name==="start"){ if(!r.players.size) return [409,{error:"まだ誰も参加していません"}];
    for(const p of r.players.values()) Object.assign(p,{v:0,ok:0,ng:0});
    r.status="playing"; r.endAt=Date.now()+r.t*1000+3000; hrBroadcast(r,true); return [200,{ok:true}]; }
  if(name==="end"){ hrEnd(r); return [200,{ok:true}]; }
  if(name!=="act") return [400,{error:"不明な操作です"}];
  const p=pl(); if(!p) return [403,{error:"参加情報が正しくありません"}];
  if(r.status!=="playing") return [409,{error:"対戦中ではありません"}];
  const MODE_OPS={chest:["add","x2","lose","steal","swap"],race:["move"]};   // 遊び方ごとに受け付ける操作
  if(b.op!=="answer"&&!(MODE_OPS[r.mode]||[]).includes(b.op)) return [403,{error:"この遊び方では使えない操作です"}];
  if(r.rule==="easy"&&["steal","swap","lose"].includes(b.op)) return [403,{error:"やさしいルールの部屋では使えません"}];
  const out={ok:true}, leader=()=>[...r.players.values()].filter(q=>q!==p).sort((a,c)=>c.v-a.v)[0];
  switch(b.op){
    case "answer": b.right?p.ok++:p.ng++; break;
    case "add": p.v+=Math.min(50,Math.max(0,b.n|0)); break;
    case "x2": if(r.mode==="chest") p.v=Math.min(p.v*2,100000); break;
    case "lose": out.n=Math.round(p.v*0.25); p.v-=out.n; break;
    case "steal": { const t=leader(); if(t&&t.v>0){ out.n=Math.round(t.v*0.2); t.v-=out.n; p.v+=out.n; out.target=t.emoji+t.name; } else { out.n=20; p.v+=20; } break; }
    case "swap": { const t=leader(); if(t&&t.v>p.v){ [t.v,p.v]=[p.v,t.v]; out.target=t.emoji+t.name; } else { p.v+=20; out.n=20; } break; }
    case "move": { if(r.mode!=="race") break; const n=Math.min(6,Math.max(1,b.n|0)); p.v=Math.min(GOAL,p.v+n);
      out.ev=evOf(r.rule)[p.v]||""; if(out.ev==="⭐") p.v=Math.min(GOAL,p.v+3); if(out.ev==="🌀") p.v=Math.max(0,p.v-2); break; }
    default: return [400,{error:"不明な操作です"}];
  }
  out.v=p.v;
  if(r.mode==="race"&&p.v>=GOAL) hrEnd(r); else hrBroadcast(r);
  return [200,out];
}
function hrHandle(r,conn,m){
  if(!m||typeof m!=="object"||!m.id) return;
  let res;
  if(m.name==="join"){ res=hrApi(r,"join",{}); if(res[0]===200) r.conns.add(conn); }
  else if(m.name==="hello"){ const b=m.body||{}, p=r.players.get(b.pid);
    if(p&&p.token===b.token){ r.conns.add(conn); res=[200,{ok:true}]; } else res=[403,{error:"参加情報が見つかりません"}]; }
  else if(m.name==="reroll"||m.name==="act") res=hrApi(r,m.name,m.body||{});
  else res=[400,{error:"不明な操作です"}];               // start / end は児童からはできない
  try{ conn.send({id:m.id,status:res[0],obj:res[1]}); }catch(e){}
  if(res[0]===200&&(m.name==="join"||m.name==="hello")) try{ conn.send({type:"state",s:hrPub(r)}); }catch(e){}
}
async function hrCreate(s){
  await loadPeer();
  if(HR){ clearInterval(HR.iv); try{HR.peer.destroy()}catch(e){} HR=null; }
  for(let i=0;i<5;i++){
    const code=String(1000+rnd(9000)), peer=new Peer(PEER_PREFIX+code);
    try{ await withTimeout(new Promise((ok,ng)=>{peer.on("open",ok);peer.on("error",ng);}),10000,"つなぎ役のサーバーに接続できませんでした"); }
    catch(e){ try{peer.destroy()}catch(_){} if(e&&e.type==="unavailable-id") continue;
      throw new Error("つなぎ役のサーバーに接続できませんでした"+(e&&e.type?"（"+e.type+"）":"")); }
    const r={code,mode:s.mode,game:s.game,g:s.g,t:s.t,rule:ruleOf(s.rule),status:"lobby",endAt:0,players:new Map(),conns:new Set(),listeners:new Set(),timer:null,peer};
    peer.on("connection",conn=>{ conn.on("data",m=>hrHandle(r,conn,m)); conn.on("close",()=>r.conns.delete(conn)); });
    peer.on("disconnected",()=>{ try{peer.reconnect()}catch(e){} });   // 途中参加できるよう仲介サーバーにつなぎ直す
    r.iv=setInterval(()=>{ if(r.status==="playing"&&Date.now()>=r.endAt) hrEnd(r); },1000);
    HR=r; return {code,hostKey:"local"};
  }
  throw new Error("部屋を作れませんでした。もう一度ためしてください");
}

/* 児童の端末から先生の端末へつなぐ */
let KC=null;
async function kcConnect(code){
  await loadPeer();
  if(KC){ try{KC.peer.destroy()}catch(e){} KC=null; }
  const peer=new Peer(), k={peer,conn:null,code,pending:new Map(),seq:0,onState:null,onLost:null};
  KC=k;
  await withTimeout(new Promise((ok,ng)=>{peer.on("open",ok);peer.on("error",ng);}),10000,"つなぎ役のサーバーに接続できませんでした")
    .catch(e=>{throw new Error(e.message||"つなぎ役のサーバーに接続できませんでした")});
  const conn=peer.connect(PEER_PREFIX+code,{reliable:true});
  await withTimeout(new Promise((ok,ng)=>{
    conn.on("open",ok);
    peer.on("error",e=>ng(new Error(e.type==="peer-unavailable"?"その部屋コードは見つかりません":"先生の端末につながりませんでした")));
  }),12000,"先生の端末につながりませんでした（学校のネットワークで止められているかもしれません）");
  k.conn=conn;
  conn.on("data",m=>{
    if(!m) return;
    if(m.type==="state") return k.onState&&k.onState(m.s);
    const pr=k.pending.get(m.id); if(!pr) return; k.pending.delete(m.id);
    m.status===200?pr.ok(m.obj):pr.ng(new Error((m.obj&&m.obj.error)||"エラー"));
  });
  conn.on("close",()=>{ if(KC===k&&k.onLost) k.onLost(); });
  return k;
}
function kcReq(name,body){
  const k=KC; if(!k||!k.conn||!k.conn.open) return Promise.reject(new Error("先生の端末との接続が切れました"));
  const id=++k.seq;
  return withTimeout(new Promise((ok,ng)=>{ k.pending.set(id,{ok,ng}); k.conn.send({id,name,body}); }),8000,"先生の端末から返事がありません");
}

/* ---- 画面からはこの2つだけを使う ---- */
async function api(name,body){
  if(NETMODE==="server") return srvApi(name,body);
  if(name==="create") return hrCreate(body);
  if(name==="start"||name==="end"){
    if(!HR||HR.code!==body.code) throw new Error("この端末で作った部屋ではありません");
    const [c,o]=hrApi(HR,name,body); if(c!==200) throw new Error(o.error); return o;
  }
  if(name==="join"){ await kcConnect(String(body.code)); return kcReq("join",{}); }
  return kcReq(name,body);
}
function listen(code,onState,onLost){
  if(ES) ES.close();
  if(NETMODE==="server"){ ES=srvListen(code,onState,onLost); return; }
  if(HR&&HR.code===code){                       // 先生の端末：自分の部屋を見る
    const f=s=>onState(s); HR.listeners.add(f);
    ES={close(){ if(HR) HR.listeners.delete(f); }};
    onState(hrPub(HR)); return;
  }
  let closed=false;                              // 児童の端末
  ES={close(){ closed=true; if(KC){KC.onState=null;KC.onLost=null;} }};
  (async()=>{
    try{
      if(!KC||KC.code!==code||!KC.conn||!KC.conn.open) await kcConnect(code);
      if(closed) return;
      KC.onState=onState; KC.onLost=onLost;
      await kcReq("hello",NET);
    }catch(e){ if(!closed) onLost(); }
  })();
}
const modeOf=s=>MODES.find(m=>m.id===s.mode), gameOf=s=>GAMES.find(x=>x.id===s.game);
/* 集めている情報の表示（待合室・結果・先生の部屋画面） */
const PRIVACY=`<p class="note privacy" style="text-align:center">🔒 ${NETMODE==="server"?"対戦用サーバーに":"先生の端末に"}送られるのは、自動でつくニックネーム・正解数・点数だけです。名前やメールアドレスは集めません。</p>`;
const unitOf=s=>s.mode==="chest"?"コイン":"マス";
const sorted=ps=>[...ps].sort((a,b)=>b.v-a.v||b.ok-a.ok);

/* --- 児童：コードを入れて参加 --- */
function renderJoin(q){

      <div class="digits" id="dg"></div><div class="err" id="jerr"></div></div>
    <div class="pad">${["1","2","3","4","5","6","7","8","9","⌫","0","→"].map(k=>`<button data-k="${k}" class="${k==="→"?"ok":""}">${k==="→"?"参加":k}</button>`).join("")}</div>
  </div>`;

  const join=async()=>{
    if(code.length!==4) return $("#jerr").textContent="4けた入れてね";
    try{ NET=await api("join",{code}); sset("mh_net",NET); go("#lobby"); }
    catch(e){ $("#jerr").textContent=e.message; }
  };
  const key=k=>{ $("#jerr").textContent="";
    if(k==="⌫") code=code.slice(0,-1); else if(k==="→") return join(); else if(code.length<4) code+=k; draw(); };
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
  app.onkeydown=null;
  window.onkeydown=e=>{ if(params().path!=="join") return window.onkeydown=null;
    if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key==="Backspace") key("⌫"); else if(e.key==="Enter") key("→"); };
  draw();
}

function startNetGame(s){

async function netBox(k,btn){
  const op=k[0]==="+"?"add":k==="none"?null:k;

    try{
      const r=await api("act",{...NET,op,n:k[0]==="+"?+k.slice(1):0});
      if(op==="add"){ label=`🪙 +${k.slice(1)}`; msg=`コイン ${k.slice(1)} まいゲット！`; }

      else if(op==="lose"){ label=`💸 −${r.n}`; msg="あっ、コインを少し落とした…"; }
      else if(op==="steal"){ label=`🦝 +${r.n}`; msg=r.target?`${esc(r.target)}から ${r.n} まいもらった！`:`コイン ${r.n} まいゲット！`; }
      else if(op==="swap"){ if(r.target){ label="🔄 こうかん"; msg=`${esc(r.target)}とコインを入れかえた！`; } else { label="🪙 +20"; msg="コイン 20 まいゲット！"; } }
      M.me.v=r.v;

  }
  if(!M||M.over) return;
  btn.classList.add("open"); btn.innerHTML=label;
  $("#mmain").querySelectorAll(".box").forEach(b=>{ if(b!==btn) b.classList.add("dim"); });

}

async function runCheck(){
  ckStop();
  const me={dead:false,peers:[]}; CK=me;
  const set=(i,st,msg)=>{ if(me.dead) return; $("#cki"+i).textContent=st; $("#ckm"+i).textContent=msg; };
  CK_STEPS.forEach((x,i)=>set(i,"⏳",i?"まだ調べていません":"調べています…"));
  $("#ckSum").innerHTML=""; $("#ckGo").disabled=true;
  const t0=performance.now(); let step=0, detail="";
  try{
    if(!window.RTCPeerConnection){ detail="このブラウザは WebRTC に対応していません"; step=2; throw new Error(detail); }
    await withTimeout(loadPeer(),15000,"時間切れ");
    set(0,"✅",CK_STEPS[0].ok+`（${Math.round(performance.now()-t0)}ミリ秒）`); step=1; set(1,"⏳","調べています…");
    const t1=performance.now();
    const open=p=>new Promise((ok,ng)=>{ p.on("open",ok); p.on("error",ng); });
    const A=new Peer(PEER_PREFIX+"check-"+rid()); me.peers.push(A);
    const B=new Peer(); me.peers.push(B);
    await withTimeout(Promise.all([open(A),open(B)]),12000,"時間切れ").catch(e=>{ detail=e&&e.type||e.message; throw e; });
    if(me.dead) return;
    set(1,"✅",CK_STEPS[1].ok+`（${Math.round(performance.now()-t1)}ミリ秒）`); step=2; set(2,"⏳","調べています…");
    A.on("connection",c=>c.on("data",m=>{ try{c.send(m)}catch(e){} }));
    const t2=performance.now();
    const conn=B.connect(A.id,{reliable:true});
    await withTimeout(new Promise((ok,ng)=>{ conn.on("open",ok); conn.on("error",ng); B.on("error",ng); }),15000,"時間切れ")
      .catch(e=>{ detail=e&&e.type||e.message; throw e; });
    const tc=performance.now()-t2, rtts=[];
    for(let i=0;i<3;i++){
      const ts=performance.now();
      await withTimeout(new Promise(ok=>{ const f=m=>{ if(m&&m.ping===i){ conn.off("data",f); ok(); } }; conn.on("data",f); conn.send({ping:i}); }),5000,"返事がありません")
        .catch(e=>{ detail=e.message; throw e; });
      rtts.push(performance.now()-ts);
    }
    if(me.dead) return;
    set(2,"✅",CK_STEPS[2].ok+`（つながるまで ${Math.round(tc)}ミリ秒）`); step=3;
    const rtt=Math.round(rtts.reduce((a,b)=>a+b,0)/rtts.length), all=((performance.now()-t0)/1000).toFixed(1);
    set(3,"✅",`全部で ${all}秒。この端末の中での往復は 平均 ${rtt}ミリ秒（同じ端末の中なので、実際より速く出ます）。`);
    $("#ckSum").innerHTML=`<div class="banner"><b>この端末から仲介サーバーにはつながります。</b><br>端末どうしがつながるかは、2台で試すまでわかりません。下の「📱📱 2台でためす」をしてください。</div>`;
  }catch(e){
    if(me.dead) return;
    const x=CK_STEPS[step];
    set(step,"❌",x.ng+(detail?`（くわしく：${detail}）`:""));
    for(let i=step+1;i<CK_STEPS.length;i++) set(i,"−",i===3?CK_STEPS[3].ng:"前のテストが失敗したので、調べていません");
    const results=CK_STEPS.map((y,i)=>`${y.t}：${i<step?"成功":i===step?"失敗":"未実施"}`).join("\n");
    const msg=ictMsg(results,detail);
    $("#ckSum").innerHTML=failBox(x.why,msg,"ckCopy"); bindCopy("ckCopy",msg);
  }finally{
    if(!me.dead){ $("#ckGo").disabled=false; for(const p of me.peers){ try{p.destroy()}catch(e){} } me.peers=[]; }
  }
}

/* --- 2台テスト --- */
const msTxt=v=>v<1?"1ミリ秒未満":v+"ミリ秒";
function pairShow(me){
  if(me.dead||!$("#pArea")) return;
  const role=me.host?"1台目（確認コードを出した端末）":"2台目（コードを入れた端末）";
  if(me.fail){
    const results=`2台テスト（${role}）：失敗 … ${me.fail}`;
    const msg=ictMsg(results,me.detail||"");
    $("#pArea").innerHTML=`<div style="font-size:18px;margin:8px 0">❌ ${esc(me.fail)}</div>`+failBox(me.why||PAIR_WHY,msg,"pCopy");
    bindCopy("pCopy",msg); return;
  }
  if(me.rtt==null){ $("#pArea").innerHTML=me.wait||""; return; }
  const ok=me.rtt<500;
  $("#pArea").innerHTML=`<div class="banner" style="border-color:var(--d)">
    <div style="font-size:20px"><b>✅ 2台の端末がつながり、メッセージが往復しました。</b></div>
    <div style="margin-top:6px">この端末から見た往復時間：<b>平均 ${msTxt(me.rtt)}</b>${me.other!=null?`／相手の端末から見た往復時間：<b>平均 ${msTxt(me.other)}</b>`:"（相手の結果を待っています…）"}</div>
    <div class="note" style="margin-top:6px">${ok?"対戦に十分な速さです。":"少しおそめです。対戦はできますが、動きがおくれることがあります。"}この2台は、同じ場所・同じネットワークなら友だち対戦が使えそうです（${esc(role)}）。</div></div>`;
}
/* つながったあと：おたがいに3回メッセージを送り、返事が来るまでの時間をはかる */
function pairRun(me,conn){
  const wait={};
  conn.on("data",m=>{
    if(!m||me.dead) return;
    if(m.ping!=null){ try{conn.send({pong:m.ping})}catch(e){} }
    if(m.pong!=null&&wait[m.pong]) wait[m.pong]();
    if(m.result!=null){ me.other=Math.max(0,Math.round(+m.result*10)/10||0); pairShow(me); }
  });
  conn.on("close",()=>{ if(!me.dead&&me.rtt==null&&!me.fail){ me.fail="相手の端末との接続が切れました"; pairShow(me); } });
  (async()=>{
    const rtts=[];
    for(let i=0;i<3;i++){
      const ts=performance.now();
      await withTimeout(new Promise(ok=>{ wait[i]=ok; conn.send({ping:i}); }),8000,"相手の端末から返事がありません");
      rtts.push(performance.now()-ts);
    }
    me.rtt=Math.round(rtts.reduce((a,b)=>a+b,0)/rtts.length*10)/10;
    try{ conn.send({result:me.rtt}); }catch(e){}
    pairShow(me);
  })().catch(e=>{ if(!me.dead){ me.fail=e.message; pairShow(me); } });
}
async function pairHost(){
  prStop();
  const me={dead:false,peers:[],host:true}; PR=me;
  me.wait=`<p>確認コードを作っています…</p>`; pairShow(me);
  try{
    await withTimeout(loadPeer(),15000,"通信の部品を読み込めませんでした");
    let peer=null, code="";
    for(let i=0;i<5&&!peer;i++){
      code=String(1000+rnd(9000)); const p=new Peer(PEER_PREFIX+"pair-"+code); me.peers.push(p);
      try{ await withTimeout(new Promise((ok,ng)=>{p.on("open",ok);p.on("error",ng);}),12000,"時間切れ"); peer=p; }
      catch(e){ try{p.destroy()}catch(_){} if(!(e&&e.type==="unavailable-id")){ me.detail=e&&e.type||e.message; throw new Error("仲介サーバーに接続できませんでした"); } }
    }
    if(me.dead) return;
    if(!peer) throw new Error("確認コードを作れませんでした。もう一度ためしてください");
    me.wait=`<div style="text-align:center"><div>2台目の端末で「2台目：コードを入れる」を押して、この数字を入れてください</div>
      <div class="bigcode">${code}</div><div class="note">3分まで待ちます</div></div>`; pairShow(me);
    me.tm=setTimeout(()=>{ if(!me.dead&&me.rtt==null&&!me.fail){ me.fail="3分待っても、2台目の端末からつながりませんでした"; me.why="2台目の端末でコードを入れたのにつながらない場合は、"+PAIR_WHY; pairShow(me); } },180000);
    let got=false;
    peer.on("connection",conn=>{
      if(got||me.dead) return; got=true; clearTimeout(me.tm);
      me.wait=`<p>2台目の端末から呼び出しがありました。つないでいます…</p>`; pairShow(me);
      me.tm=setTimeout(()=>{ if(!me.dead&&!conn.open){ me.fail="2台目の端末から呼び出しはありましたが、端末どうしがつながりませんでした"; me.detail="仲介サーバーまでは通じています"; pairShow(me); } },20000);
      conn.on("open",()=>{ clearTimeout(me.tm); pairRun(me,conn); });
    });
  }catch(e){ if(!me.dead){ me.fail=e.message; if(/^通信の部品/.test(e.message)) me.why=CK_STEPS[0].why; else if(/^仲介/.test(e.message)) me.why=CK_STEPS[1].why; pairShow(me); } }
}
function pairJoinPad(){
  prStop();
  let code="";
  $("#pArea").innerHTML=`<div style="text-align:center"><div>1台目の端末に出ている<b>4けたの確認コード</b>を入れてください</div>
    <div class="digits" id="pdg"></div><div class="err" id="perr"></div></div>
    <div class="pad">${["1","2","3","4","5","6","7","8","9","⌫","0","→"].map(k=>`<button data-pk="${k}" class="${k==="→"?"ok":""}">${k==="→"?"つなぐ":k}</button>`).join("")}</div>`;
  const draw=()=>{ $("#pdg").innerHTML=[0,1,2,3].map(i=>`<div class="digit ${i===code.length?"on":""}">${code[i]||""}</div>`).join(""); };
  $("#pArea").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.pk; $("#perr").textContent="";
    if(k==="⌫") code=code.slice(0,-1);
    else if(k==="→"){ if(code.length!==4) return $("#perr").textContent="4けた入れてください"; return pairJoin(code); }
    else if(code.length<4) code+=k;
    draw();
  });
  draw();
}
async function pairJoin(code){
  prStop();
  const me={dead:false,peers:[],host:false}; PR=me;
  me.wait=`<p>確認コード ${esc(code)} の端末につないでいます…（20秒ほど）</p>`; pairShow(me);
  try{
    await withTimeout(loadPeer(),15000,"通信の部品を読み込めませんでした");
    const peer=new Peer(); me.peers.push(peer);
    await withTimeout(new Promise((ok,ng)=>{peer.on("open",ok);peer.on("error",ng);}),12000,"時間切れ")
      .catch(e=>{ me.detail=e&&e.type||e.message; throw new Error("仲介サーバーに接続できませんでした"); });
    if(me.dead) return;
    const conn=peer.connect(PEER_PREFIX+"pair-"+code,{reliable:true});
    await withTimeout(new Promise((ok,ng)=>{
      conn.on("open",ok);
      peer.on("error",e=>{ if(e&&e.type==="peer-unavailable"){ me.why="1台目の端末で確認コードを出したままにしているか、数字が合っているかを確かめてください。"; ng(new Error("その確認コードの端末が見つかりません")); } else { me.detail=e&&e.type; ng(new Error("1台目の端末につながりませんでした")); } });
    }),20000,"1台目の端末につながりませんでした（仲介サーバーまでは通じています）");
    if(me.dead) return;
    pairRun(me,conn);
  }catch(e){ if(!me.dead){ me.fail=e.message; if(/^通信の部品/.test(e.message)) me.why=CK_STEPS[0].why; else if(/^仲介/.test(e.message)) me.why=CK_STEPS[1].why; pairShow(me); } }
}

/* ================= ルーター ================= */
function route(){
  stopTimer(); P=null; M=null; ckStop(); prStop();
  if(ES){ ES.close(); ES=null; }
  const {path,q}=params();
  window.scrollTo(0,0);
  if(!DATA_OK&&path!=="check"&&path!=="teacher"){
    app.innerHTML=`<div class="q">問題データ（data フォルダ）を読み込めませんでした。<br>index.html と同じ場所に data フォルダがあるか確認してください。</div>`; return;
  }
  if(path==="check") renderCheck();
  else if(path==="play") renderPlay(q);
  else if(path==="modesetup") renderModeSetup(q);
  else if(path==="mode") renderMode(q);
  else if(path==="join") renderJoin(q);
  else if(path==="lobby") renderLobby();
  else if(path==="host") renderHost();
  else if(path==="teacher") renderTeacher();
  else renderHome();
}
window.addEventListener("hashchange",route);
refreshMedals(); route();
