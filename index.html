<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まなびひろば</title>
<link rel="stylesheet" href="vendor/fonts/biz-udpgothic.css">
<style>
:root{
  /* ===== 色（トークン）。文字と背景の組み合わせは 4.5:1 以上（数値は README に記載） ===== */
  --board:#1f4d3a;      /* 黒板の深緑：ヘッダー・問題のボード（白い文字 9.6:1） */
  --field:#e9f4e4;      /* 校庭：ページの背景（濃い文字 13:1） */
  --ink:#1b2a22;        /* 文字の濃色 */
  --muted:#46564d;      /* 補助の文字（校庭の上で 6.9:1、白の上で 7.8:1） */
  --edge:#16372a;       /* 押せる物の太いふち・下影 */
  --paper:#ffffff;
  --line:#c9d8c8;       /* 押せない物のうすい線 */
  --chalk:#d6ebdd;      /* 黒板の上の補助の文字 */
  --math:#cf3d2c;       /* 算数・赤（白い文字 4.8:1） */
  --jp:#2f6fd8;         /* 国語・青（白い文字 4.8:1） */
  --soc:#f2c230;        /* 社会・黄（濃い文字 9:1） */
  --eng:#7a4cc8;        /* 英語・紫（白い文字 5.7:1） */
  --btl:#8a5a2b;        /* バトル・木（白い文字 5.9:1） */
  --go:#1b7a4b;         /* 進む・決めるボタンの緑（白い文字 5.3:1） */
  --sun:#ff9422;        /* 「1分であそぶ」（濃い文字 6.8:1） */
  --wood:#c9a066;       /* ボードのふち */
  --main:var(--go); --main2:#e1f0e3; --accent:#ff9422;
  --a:var(--math); --b:var(--jp); --c:var(--soc); --d:#1b7a4b;
  --agreen:#7ccf6b; --agray:#b9c6c0; --pink:#f6a9b4; --cream:#fff3d6;   /* 絵の色（動物・めばえ） */
  --bronze:#d08a4e; --silver:#cdd6d3; --gold:#f6c431;   /* メダル */
  --bad:#b3261e;        /* まちがい・警告の赤（白の上で 6.5:1） */
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);
  background-color:var(--field);       /* 校庭のうすい格子（CSSだけ） */
  background-image:linear-gradient(rgba(31,77,58,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(31,77,58,.07) 2px,transparent 2px);
  background-size:36px 36px;
  font-family:'BIZ UDPGothic',"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;font-weight:400}
b,strong,h1,h2,h3{font-weight:700}
a{color:#0b5a8f}
button,input,select,textarea{font-family:inherit}
button{color:var(--ink);font-weight:700}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:none}
/* ===== 押せる物：太いふち＋下影。押すと沈む。押せない物には影を付けない ===== */
.btn,.pill,.back,.hbtn,.tile,.choice,.pad button,.gbtn,.mode,.box,.spk,.qm,.hero,.mcard .bad{
  border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer;
  transition:transform .06s ease-out,box-shadow .06s ease-out;-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled),.pill:active:not(:disabled),.back:active:not(:disabled),.hbtn:active:not(:disabled),.tile:active:not(:disabled),.choice:active:not(:disabled),
.pad button:active:not(:disabled),.gbtn:active:not(:disabled),.mode:active:not(:disabled),.box:active:not(:disabled),.spk:active,.qm:active,.mcard .bad:active{
  transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
button:disabled{opacity:.55;cursor:default;box-shadow:none;transform:translateY(3px)}
/* ===== ヘッダー（黒板） ===== */
header{background:var(--board);color:#fff;padding:6px 14px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--edge)}
header h1{margin:0;font-size:inherit}
header .logo{font:inherit;font-size:24px;font-weight:800;cursor:pointer;letter-spacing:.06em;background:none;border:0;color:#fff;min-height:44px;padding:0 4px;text-shadow:2px 2px 0 var(--edge)}
header .logo:disabled{color:#fff;cursor:default;opacity:1;box-shadow:none;transform:none}
header .sp{flex:1}
.hbtn{background:#fff;color:var(--ink);border-radius:12px;padding:0 12px;min-height:44px;min-width:44px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 var(--edge)}
.hbtn.snd{padding:0}
.hx{display:none}
body[data-v=home] .hx,body[data-v=record] .hx{display:inline-flex}
body.lesson .hx{display:none!important}
body.lesson .logo{pointer-events:none}
#hRec b{font-size:18px}
#hRec .art{width:24px;height:24px}
.hbtn,header .logo{white-space:nowrap}
@media (max-width:430px){.slot,.slot .art{width:38px;height:38px}.stamp .slots{gap:4px}.stamp .sico,.stamp .sico .art{width:36px;height:36px}.stamp{gap:8px} header{padding:6px 8px;gap:6px} header .logo{font-size:19px;letter-spacing:.02em;padding:0 2px} .hbtn{padding:0 8px;font-size:15px;gap:4px} .hbtn.snd{padding:0}}
/* ===== 全体 ===== */
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:12px 16px;flex:1;display:flex;flex-direction:column}
h2{font-size:20px;margin:18px 0 8px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{min-height:44px;background:#fff;border-radius:22px;padding:6px 16px;font-size:16px;color:var(--ink)}
.pill.on{background:var(--go);color:#fff}
.pill.small{padding:4px 12px;font-size:14px;min-height:44px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;margin-right:4px}
.newbest{color:#8a3b00;font-weight:700;font-size:18px;margin-top:4px}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.banner{background:#fff3d6;border:2px solid #b97100;border-radius:6px;padding:10px 14px;margin-bottom:12px}
.empty{color:var(--muted);padding:20px;text-align:center;background:#fff;border:2px dashed var(--line)}
.err{color:var(--bad);font-weight:700;min-height:24px}
/* ===== ホーム ===== */
.home{display:flex;flex-direction:column;gap:12px;flex:1}
.hero{width:100%;background:var(--sun);color:var(--ink);border-radius:24px;padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:16px;
  border-width:4px;box-shadow:0 7px 0 var(--edge);text-align:left;transition:transform .06s ease-out,box-shadow .06s ease-out}
.hero:active{transform:translateY(5px);box-shadow:0 2px 0 var(--edge)}
.hero .ic{width:52px;height:52px;stroke-width:2.2;fill:#fff;flex:none}
.hero .ht{font-size:clamp(30px,6vw,44px);font-weight:800;line-height:1.1;display:block;letter-spacing:.04em}
.hero .ht{white-space:nowrap}
@media (max-width:430px){.hero{gap:10px;padding:12px 14px}.hero .ic{width:36px;height:36px}.hero .mb{width:46px;height:52px}.hero .ht{font-size:clamp(24px,7.4vw,32px);letter-spacing:.02em}.hero .hn{font-size:13px}}
.hero .hn{display:block;font-size:14px;font-weight:400;margin-top:4px}
.hero .mb{width:56px;height:63px}
.guide{display:flex;align-items:center;gap:10px;justify-content:center;margin:-2px 0}
.guide .mb{width:60px;height:68px}
.guide span.say{background:#fff;border:3px solid var(--edge);border-radius:16px;padding:6px 14px;font-weight:700;font-size:18px;position:relative}
.guide span.say::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid var(--edge);border-left:0}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px)}60%{transform:translateY(0)}78%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.mb.hop{animation:hop .7s ease-out 1 both}
.zones{display:grid;grid-template-columns:1fr;gap:14px;align-items:stretch}
/* 区画の並べかた：すき間ができないように、区画の数（data-n）ごとに決める。 640px〜：2列、900px〜：3列（6分割で、バトルは残りをうめる） */
@media (min-width:640px){.zones{grid-template-columns:repeat(2,1fr)} .zones[data-n="3"] .s-btl,.zones[data-n="5"] .s-btl{grid-column:1/-1}
  .zones[data-n="3"] .s-btl .tiles,.zones[data-n="5"] .s-btl .tiles{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.zones{grid-template-columns:repeat(6,1fr)} .zone{grid-column:span 2}
  .zones[data-n="3"] .s-btl{grid-column:span 2} .zones[data-n="3"] .s-btl .tiles{grid-template-columns:1fr} .zones[data-n="4"] .s-btl{grid-column:1/-1} .zones[data-n="5"] .s-btl{grid-column:span 4}
  .zones[data-n="4"] .s-btl .tiles,.zones[data-n="5"] .s-btl .tiles{grid-template-columns:repeat(2,1fr)}}
.zone{background:var(--zc);color:var(--zt,#fff);padding:10px 12px 14px;border-radius:6px 6px 18px 18px;border-top:8px solid var(--edge)}
.zone h2{margin:0 0 8px;font-size:20px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.zone.s-math{--zc:var(--math)} .zone.s-jp{--zc:var(--jp)} .zone.s-soc{--zc:var(--soc);--zt:var(--ink)} .zone.s-eng{--zc:var(--eng)} .zone.s-btl{--zc:var(--btl)}
.tiles{display:grid;gap:8px}
.play .tiles{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{width:100%;background:#fff;color:var(--ink);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:12px;text-align:left;min-height:76px}
.art{display:block;flex:none;overflow:visible}
.tile .tico{flex:none;width:56px;height:56px}
.tile .tico .art{width:56px;height:56px}
.tile .tbody{display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .tt{font-size:18px;font-weight:800}
.tile .tstat{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-weight:400}
.tile .tstat .st{width:24px;height:24px}
.tile .tstat .st:not(.on){opacity:.6}
.ti{display:inline-block;width:28px;height:28px;vertical-align:-7px}
.mi{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em}
.fc{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.3em;flex:none}
.tile .tstat .bv{margin-left:6px}
.tile .tnext{font-size:14px;font-weight:700;color:#8a3b00}
.tile .td{font-size:13px;color:var(--muted);font-weight:400}
.home.easy .tile{min-height:112px;padding:12px 16px}
.home.easy .tile .tico,.home.easy .tile .tico .art{width:64px;height:64px}
.home.easy .tile .tt{font-size:22px;line-height:1.25}
.home.easy .tile .tstat,.home.easy .tile .tnext{font-size:16px}
.home.easy .zone h2{font-size:24px}
.home.easy .hero{padding:18px 20px}
.bottom{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:auto;padding-top:4px}
.bottom .hbtn{font-size:15px}
.gdlink{display:block;width:100%;text-align:center;font-size:14px;color:var(--ink);text-decoration:underline;padding:8px 0}
.more{width:100%;text-align:center}
.more summary{cursor:pointer;display:inline-block;color:var(--muted);font-size:14px;min-height:32px;padding:4px 8px}
.more .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;text-align:left;margin-top:6px}
.link{background:#fff;border:2px solid var(--line);padding:10px;text-decoration:none;color:var(--ink);border-radius:6px}
.link b{display:block;margin-bottom:2px}
.link span{font-size:13px;color:var(--muted)}
/* 学年えらびのシート */
.sheetbg{position:fixed;inset:0;background:rgba(15,40,28,.55);z-index:30;display:flex;align-items:flex-start;justify-content:flex-end;padding:64px 14px 14px}
.sheet{background:#fff;border:4px solid var(--edge);border-radius:14px;padding:14px;width:min(100%,340px)}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet .gradegrid{max-width:none}
.sheet .gbtn{min-height:60px;font-size:26px}
/* ===== プレイ画面：上＝時間の帯、中央＝問題（最大）、下＝4択 ===== */
.play{width:100%;max-width:640px;margin:0 auto;text-align:center}
.play.pg,.mplay{flex:1;display:flex;flex-direction:column}
.mplay{width:100%;max-width:980px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.topbar>:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.back{background:#fff;border-radius:12px;padding:6px 14px;font-size:15px;white-space:nowrap;flex:none;min-height:44px;color:var(--ink);box-shadow:0 3px 0 var(--edge)}
.timer{font-size:24px;font-weight:800;white-space:nowrap;flex:none;min-width:2.4ch;text-align:right}
.timer.warn{font-size:40px;color:var(--bad);line-height:1}
.tbar{height:16px;background:#fff;border:3px solid var(--edge);border-radius:8px;overflow:hidden;margin-bottom:12px}
.tbar>i{display:block;height:100%;background:var(--go);width:100%;transition:width .2s linear}
.tbar.warn>i{background:var(--bad)}
.q{background:var(--board);color:#fff;border:6px solid var(--wood);border-radius:6px;padding:20px 14px;margin-bottom:12px;text-align:center}
.q .note{color:var(--chalk)}
.q .err{color:#ffc9c2}
.q .bigcode,.q .countdown{color:#ffe066}
.q .digit{color:var(--ink)}
.q .ptable td{border-bottom-color:rgba(255,255,255,.3)}
.play.pg>.q,#mmain>.q:first-child{display:flex;flex-direction:column;justify-content:center}
.play.pg>.q{flex:1;min-height:110px}
.q .big{font-size:clamp(40px,11vw,76px);font-weight:800;line-height:1.2}
.q .small{color:var(--chalk);margin-top:6px;font-size:16px}
.answer{font-size:38px;font-weight:800;min-height:50px;border-bottom:4px solid var(--go);display:inline-block;min-width:170px;margin:0 auto 10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto;width:100%}
.pad button{font-size:26px;padding:6px 0;min-height:48px;border-radius:12px;background:#fff;color:var(--ink)}
.pad button.zero{grid-column:span 2}
.pad button.ok{background:var(--go);color:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{position:relative;font-size:clamp(20px,5vw,30px);padding:14px 8px;border-radius:14px;color:#fff;font-weight:800;min-height:84px;box-shadow:0 5px 0 var(--edge)}
.ca{background:var(--a)} .cb{background:var(--b)} .cc{background:var(--c);color:var(--ink)} .cd{background:var(--d)}
.choice rt{font-size:.5em;font-weight:400}
.choice .kh{position:absolute;top:4px;left:8px;font-size:14px;line-height:1;opacity:.85;font-weight:700}
.spk{font-size:22px;vertical-align:middle;margin-left:10px;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--ink);padding:0}
.spk .ic{width:28px;height:28px}
.choice.wrong{opacity:.35;box-shadow:none;transform:translateY(3px)} .choice.right{outline:5px solid var(--ink);outline-offset:2px}
.score{font-size:15px;color:var(--muted);margin-top:8px}
.fb{min-height:34px;font-size:24px;font-weight:800;margin:2px 0 10px}
.fb.end{font-size:30px;color:var(--bad)}
.fb.ok{animation:pop .25s ease-out;color:#0f6a3a} .fb.ng{color:var(--bad)}
@keyframes pop{from{transform:scale(1.25)}to{transform:scale(1)}}
/* ===== 結果：メダル → あと○もん → もういっかい → まちがえた問題 ===== */
.res{background:#fff;border:2px solid var(--line);border-radius:22px 22px 6px 6px;padding:20px 16px 18px}
.medalwrap{position:relative;display:inline-block;padding:8px;isolation:isolate}
.medal{display:block;animation:medalIn .9s cubic-bezier(.2,1.4,.4,1) both}
.medal .art{width:112px;height:112px}
.medrow{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.medrow .mb{width:72px;height:81px;margin-bottom:6px}
.medrow .mb.big{width:112px;height:126px;margin:6px 0}
.medalwrap.m3 .medal .art{filter:drop-shadow(0 0 10px rgba(242,194,48,.9))}
.medalwrap.m3::before,.medalwrap.m2::before,.medalwrap.m1::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(242,194,48,0),rgba(242,194,48,.55),rgba(242,194,48,0),rgba(255,148,34,.5),rgba(242,194,48,0));animation:shine 3s linear 1;z-index:-1}
.medalwrap.m1::before{opacity:.5} .medalwrap.m2::before{opacity:.75}
@keyframes medalIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes shine{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.res .num{font-size:34px;font-weight:800;color:var(--ink)}
.res .nextm{font-size:22px;font-weight:800;color:#8a3b00;margin:4px 0 6px}
.res .actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin:12px 0}
.res .again{font-size:26px;padding:16px 28px;min-width:min(100%,320px);border-radius:18px}
.res .subs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0;font-size:14px;color:var(--muted)}
.stats span{background:var(--main2);padding:4px 10px;border-radius:4px}
.stats b{color:var(--ink)}
.res table{margin:12px auto;border-collapse:collapse;font-size:16px}
.res td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:left}
.res td:last-child{text-align:right;font-weight:700}
.btn{display:inline-block;background:var(--go);color:#fff;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;margin:4px}
.btn.sub{background:#fff;color:var(--ink)}
.btn .ic{margin-right:6px}
.miss{font-size:14px;text-align:left;background:#f4f8f1;border-radius:4px;padding:10px 14px;margin-top:10px}
.mcard{background:#fff;border:2px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
.mcard .mq{font-size:24px;font-weight:800}
.mcard .ma{font-size:20px}
.mcard .bad{min-height:44px;font-size:15px;background:#fff;border-radius:10px;margin-top:6px;padding:6px 12px;color:var(--ink);box-shadow:0 3px 0 var(--edge);font-weight:700}
.mcard .badid{font-size:16px;margin-top:6px;background:#fff3d6;border-radius:4px;padding:6px 10px}
/* ===== 先生の画面（フォームのカードを縦に重ねる形。あとで「問題を作る」カードを足せる） ===== */
.form{background:#fff;border:2px solid var(--line);border-left:8px solid var(--board);border-radius:4px 14px 14px 4px;padding:14px;display:grid;gap:12px}
.form label{display:grid;gap:6px;font-weight:700;font-size:15px}
.form select{font-size:16px;padding:8px;border-radius:8px;border:2px solid var(--edge);font-family:inherit;background:#fff;color:var(--ink)}
.out{background:#eef7ef;border:2px solid var(--go);border-radius:6px;padding:10px;word-break:break-all;font-size:14px}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.prep{font-size:14px;background:var(--main2);border-radius:4px;padding:6px 10px;color:var(--ink)}
.th2{display:flex;align-items:center;gap:8px}
/* ===== 教室で映す ===== */
.proj{position:fixed;inset:0;background:#10261c;color:#fff;display:flex;flex-direction:column;padding:24px;z-index:10}
.proj .ptop{display:flex;justify-content:space-between;font-size:22px}
.proj .pq{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,96px);font-weight:800;text-align:center}
.proj .pc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.proj .pc div{font-size:clamp(22px,3.5vw,40px);padding:22px;border-radius:14px;font-weight:800}
.proj .pc div.dim{opacity:.25}
.proj .pc rt{font-size:.45em;font-weight:400}
.proj .pbtns{text-align:center;margin-top:16px}
.proj .count{font-size:48px;font-weight:800;color:#ffd166}
/* ===== バトルモード ===== */
.mode{background:#fff6e3;border-radius:14px;padding:12px;text-align:left;display:flex;gap:12px;align-items:center;color:var(--ink)}
.mode .ico{font-size:48px}
.mode .t{font-size:19px;font-weight:800;display:block}

@media (min-width:700px){.fz{grid-template-columns:repeat(8,1fr)}.gridh{grid-template-columns:repeat(6,1fr)}.hscene{padding:12px;gap:12px}.fs .cap{font-size:12px}}
@media (prefers-reduced-motion:reduce){.door,.hc{transition:none}}
/* ===== ロケット はっしゃ（協力モード） ===== */
.rks{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.rks.sm{width:28px;height:28px}
.rks.big{width:96px;height:120px;margin:0 auto;display:block}
.rkk .q .big,.rkk .q .small{word-break:keep-all;overflow-wrap:anywhere}
.rkk{padding-bottom:20px}
.rk-hd{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin:4px 0 8px}
.rk-kg{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--edge);border-radius:14px;padding:6px 12px;font-size:16px;font-weight:700;margin-bottom:10px}
.rk-kg b{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.rk-hbar{flex:1;height:22px;background:#e4ece6;border:3px solid var(--edge);border-radius:14px;overflow:hidden}
.rk-hbar i{display:block;height:100%;width:0;background:var(--sun);border-radius:10px;transition:width .6s ease}
.rk-hbar.big{height:30px;margin:6px 0}
.rk-hbar.star i{background:var(--soc)}
.rk-qh{font-size:18px;font-weight:700;text-align:center;margin:4px 0 8px;color:var(--muted)}
.rk-boost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0 0;min-height:60px;font-size:22px;background:var(--sun);color:var(--ink)}
.rk-boost:disabled{background:#e0e8e2}
.rkm .q{margin-bottom:8px}
.rk-beat{font-size:min(34vw,170px);font-weight:900;line-height:1.05;text-align:center;min-height:1.1em;color:var(--board);font-variant-numeric:tabular-nums}
.rk-beat.go{color:var(--math);animation:rkgo .5s ease-out}
.rk-rd{text-align:center;font-weight:800;font-size:18px;color:var(--muted)}
.rk-press{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:26vh;margin:8px 0;border-radius:24px;background:var(--math);color:#fff;font-size:44px;font-weight:900;border:4px solid var(--edge);box-shadow:0 7px 0 var(--edge);cursor:pointer;touch-action:manipulation}
.rk-press:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--edge)}
.rk-press:disabled{background:#c4cdc8;color:#46564d;box-shadow:none;transform:translateY(5px)}
.rk-press .rks{width:64px;height:64px}
.rk-hit{min-height:42px;text-align:center;font-size:30px;font-weight:900;color:#0f6a3a}
.rk-hit.soft{color:var(--muted);font-size:22px}
.rk-sky{position:relative;height:46vh;min-height:260px;overflow:hidden;border:4px solid var(--edge);border-radius:18px;background:linear-gradient(#0b0d2b,#2b2f78);touch-action:manipulation}
.rk-fs{position:absolute;top:0;width:80px;height:80px;padding:0;border:0;background:none;box-shadow:none;cursor:pointer;animation:rkfall linear forwards}
.rk-fs .rks{width:80px;height:80px}
.rk-fs.caught{animation:none;transform:scale(1.7);opacity:0;transition:transform .2s,opacity .2s}
.rk-got{text-align:center;font-size:26px;font-weight:800;margin:8px 0;display:flex;justify-content:center;align-items:center;gap:6px}
.rk-sc{text-align:center;font-size:20px;font-weight:700;color:var(--muted);min-height:28px}
.rk-me .big2{font-size:22px;font-weight:800;margin:6px 0}
@keyframes rkfall{from{transform:translateY(-90px) rotate(-6deg)}to{transform:translateY(52vh) rotate(6deg)}}
@keyframes rkgo{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
/* 先生の大画面：1280×720 でスクロールなし・文字は28px以上 */
.px.rk-px{padding:0;position:relative;overflow:hidden}
.rkh{position:absolute;inset:0;color:#fff;font-size:28px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.rkh-bg{position:absolute;inset:0;width:100%;height:100%}
.rkh-top{position:absolute;left:20px;right:20px;top:14px;display:flex;align-items:center;gap:14px;z-index:3}
.rkh-top>span{background:rgba(22,55,42,.86);border:3px solid #fff;border-radius:16px;padding:2px 16px;font-weight:800;white-space:nowrap}
.rkh-top .rkh-t3{margin-left:auto}
.rkh-top .rkh-t3:empty{display:none}
.rkh-dots{position:absolute;left:20px;top:78px;display:flex;gap:10px;z-index:3}
.rkh-dots i{width:34px;height:34px;border-radius:50%;background:rgba(22,55,42,.7);border:4px solid #fff;display:block}
.rkh-dots i.done{background:var(--soc)}
.rkh-dots i.cur{background:#fff;box-shadow:0 0 0 5px var(--sun)}
.rkh-rocket{position:absolute;left:22%;width:150px;height:300px;bottom:5.5%;transform-origin:50% 100%;transition:bottom 1.6s cubic-bezier(.4,0,.2,1),transform 1s;z-index:2}
.rkh-rocket svg{width:100%;height:100%;overflow:visible}
.rkh-rocket.shake{animation:rkshake .25s linear infinite}
.rkh-rocket.idle .fl1,.rkh-rocket.idle .fl2{display:none}
.rkh-rocket .fl2{animation:rkfl .3s steps(1,end) infinite}
.rkh-rocket .fl1{animation:rkfl .3s steps(1,end) infinite reverse}
.rkh-pad{position:absolute;left:calc(22% - 105px);width:360px;height:60px;bottom:16%;z-index:1}
.rkh-gauge{position:absolute;right:24px;top:84px;width:300px;z-index:3;text-align:center}
.rkh-gauge .gl{background:rgba(22,55,42,.86);border:3px solid #fff;border-radius:16px;padding:0 10px;font-weight:800;margin-bottom:6px;white-space:nowrap}
.rkh-gauge svg{width:104px;height:360px;display:block;margin:0 auto}
.rkh-gauge .gp{font-weight:900;font-size:36px;background:rgba(22,55,42,.86);border:3px solid #fff;border-radius:16px;margin:6px auto 0;width:150px}
#rkfill{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s ease}
.rkh-mid{position:absolute;left:42%;top:150px;width:36%;z-index:3}
.rkm-card{background:rgba(22,55,42,.9);border:4px solid #fff;border-radius:22px;padding:12px 20px;text-align:center}
.rkm-card h2{margin:0 0 4px;font-size:40px}
.rkm-card .hint{font-size:28px}
.rkm-big{font-size:150px;font-weight:900;line-height:1.05;color:#ffe066;font-variant-numeric:tabular-nums;min-height:1.05em}
.rkm-big.go{color:#ff9d8f;animation:rkgo .5s ease-out}
.rkm-bar{height:40px;background:rgba(255,255,255,.25);border:3px solid #fff;border-radius:22px;overflow:hidden;margin:8px 0 4px}
.rkm-bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s ease}
.rkm-bar.star i{background:var(--soc)}
.rkm-clear{font-size:56px;font-weight:900;color:#ffe066;text-shadow:3px 3px 0 var(--edge)}
.rkm-end{font-size:60px;font-weight:900;color:#ffe066;text-shadow:4px 4px 0 var(--edge);line-height:1.2}
.rkh-note{position:absolute;left:44%;top:82px;z-index:4;display:flex;gap:10px;flex-wrap:wrap}
.rkh-note span{background:#fff;color:var(--ink);border:3px solid var(--edge);border-radius:16px;padding:0 14px;font-weight:800}
.rkh-n{position:absolute;left:20px;bottom:76px;background:rgba(22,55,42,.86);border:3px solid #fff;border-radius:16px;padding:0 14px;font-weight:800;z-index:3}
.rkh-row{position:absolute;left:20px;bottom:14px;display:flex;gap:6px;z-index:3;max-width:calc(100% - 640px)}
.rkh-row [data-pid]{display:inline-flex;background:rgba(255,255,255,.88);border:3px solid var(--edge);border-radius:50%;padding:2px;cursor:pointer}
.rkh-row .fc{width:46px;height:46px}
.rkh-row [data-pid].hop{animation:rkhop .5s ease-out}
@keyframes rkfl{0%{opacity:1}50%{opacity:0}}
@keyframes rkshake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,1px)}75%{transform:translate(2px,2px)}}
@keyframes rkhop{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  .rk-fs{animation:none!important}.rk-beat.go,.rkm-big.go{animation:none}.rkh-rocket,.rkh-rocket.shake,.rkh-rocket .fl1,.rkh-rocket .fl2{transition:none;animation:none}.rkh-rocket .fl2{opacity:0}
  .rk-hbar i,.rkm-bar i,#rkfill{transition:none}.rkh-row [data-pid].hop{animation:none}}
</style>

const scriptP={};
function loadScript(src,have){
  if(have&&have()) return Promise.resolve();
  if(!scriptP[src]) scriptP[src]=new Promise((ok,ng)=>{
    const el=document.createElement("script"); el.src=src; el.onload=ok;
    el.onerror=()=>{ delete scriptP[src]; ng(new Error("load "+src)); };
    document.head.appendChild(el);
  });
  return scriptP[src];
}

function fgText(n){

function fgWalk(root){
  if(root.nodeType===3) return fgText(root);
  if(root.nodeType!==1) return;
  fgAttr(root);
  const w=document.createTreeWalker(root,5), ts=[]; let n;
  while((n=w.nextNode())){ if(n.nodeType===3){ if(n.nodeValue.indexOf("《")>=0) ts.push(n); } else fgAttr(n); }
  ts.forEach(fgText);
}

/* ================= 問題を作る ================= */
/* 計算は data/calc.js で学年の単元に合わせて作る（分数の学年は4択になる） */
function makeCalc(g){ return window.MH_CALC.make(g,rnd,shuffle); }
function makeKuku(){ const a=1+rnd(9),b=1+rnd(9); return {q:`${a} × ${b}`,a:a*b}; }
/* 4択：まちがいの選択肢を、正解と「長さ・種類」が近いものから選ぶ（選びかたは data/choices.js） */
function makeKanji(g){
  const list=KANJI[g]||KANJI[1], item=list[rnd(list.length)];
  return {id:item.id,q:item.q,a:item.a,ch:shuffle([item.a,...MH_CHOICE.kanji(QD.kanji,item,shuffle)]),small:T("q.kanji")};
}
function makeEigo(g){
  let pool=EIGO.filter(x=>(x.g||5)<=g); if(pool.length<4) pool=EIGO;     // 学年より上の単語は出さない
  const item=pool[rnd(pool.length)];
  return {id:item.id,q:item.q,a:item.a,ch:shuffle([item.a,...MH_CHOICE.eigo(pool,item,shuffle)]),small:T("q.eigo")};
}
/* 県庁所在地：まちがいの選択肢は同じ地方から。足りないときは近い地方から（地方は data/questions.js） */
function makeKencho(only){
  const pool=only?KENCHO.filter(kDiff):KENCHO, item=pool[rnd(pool.length)];
  const RG=QD.kenchoRegions||{}, seen=new Set([item.a]), out=[];
  const add=list=>{ for(const y of shuffle(list)){ if(out.length>=3) break; if(!seen.has(y.a)){ seen.add(y.a); out.push(y); } } };
  add(KENCHO.filter(y=>y.rg===item.rg));
  for(const r of ((RG[item.rg]||{}).near||[])) if(out.length<3) add(KENCHO.filter(y=>y.rg===r));
  if(out.length<3) add(KENCHO);
  return {id:item.id,q:item.q,a:item.a,ch:shuffle([item.a,...out.map(y=>y.a)]),small:T("q.kencho")};
}
function gen(id,g,opt){
  if(id==="mine") return genMine();
  if(id==="calc") return makeCalc(g);

/* 九九の段えらび：えらんだ段を、上り・下り・ばらばらの順に出す（一巡したらまた始める） */
const parseDans=s=>[...new Set(String(s||"").split(",").map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=9))].sort((a,b)=>a-b);
function kukuSeq(dans,order){
  const ds=(dans&&dans.length?[...dans]:[1,2,3,4,5,6,7,8,9]).sort((a,b)=>a-b);
  if(order==="down") ds.reverse();
  const pairs=[]; for(const a of ds) for(let i=1;i<=9;i++) pairs.push([a,order==="down"?10-i:i]);
  return order==="rand"?shuffle(pairs):pairs;
}
function kukuNext(){
  const k=P.kuku;
  if(k.i>=k.seq.length){ const last=k.seq[k.seq.length-1]; k.seq=kukuSeq(k.d,k.o); k.i=0;
    if(k.o==="rand"&&last&&k.seq.length>1&&k.seq[0][0]===last[0]&&k.seq[0][1]===last[1]) k.seq.push(k.seq.shift()); }
  const [a,b]=k.seq[k.i++]; return {q:`${a} × ${b}`,a:a*b};
}

function key(k){
  if(!P||P.lock) return;
  if(k==="⌫") P.inp=P.inp.slice(0,-1);
  else if(k==="OK"){ if(P.inp!=="") judge(parseFloat(P.inp)===P.cur.a, P.cur.a); return; }
  else if(P.inp.length<7) P.inp+=k;
  $("#ans").innerHTML=P.inp?esc(P.inp):"&nbsp;";

function pick(b){
  if(P.lock) return;

  $("#area").querySelectorAll(".choice").forEach(e=>{ if(e.dataset.c===P.cur.a) e.classList.add("right"); else e.classList.add("wrong"); });

function judge(right,ans){
  const p=P; p.lock=true;
  const fb=$("#fb");
  sfx(right?"ok":"ng");
  if(right){ p.ok++; fb.className="fb ok"; fb.textContent=T("fb.ok"); }
  else {
    p.ng++; p.misses.push(`${p.cur.q} → ${ans}`); p.missObjs.push(p.cur);
    if(p.review&&!p.cur.retry) p.queue.push({...p.cur,retry:true});    // ふくしゅう中にまちがえた問題は、最後にもう一度

  if(p.review) $("#scw").innerHTML=T("p.left",p.queue.length); else $("#sc").textContent=p.ok;

  setTimeout(()=>{ if(P!==p) return; if(p.review||(p.left>0&&timerId)){ fb.className="fb"; fb.textContent=""; next(); } }, right?350:(p.cur.ch?1800:1100));
}
function finish(){
  const p=P; if(!p||p.done) return; p.done=true; p.lock=true;

  /* メダルの基準：4択か入力かで分ける（両方が出るときは出た割合で混ぜる）。正答率の条件もつける */
  const nAll=p.chN+p.inN, wc=nAll?p.chN/nAll:(p.x.type==="choice"?1:0);

  const repFull=report+missIds(p.missObjs,p.x);          // 課題リンクの結果の末尾に、まちがえた問題のID
  app.innerHTML=`<div class="play"><div class="res">
    ${medRow(medal)}

    ${showNew?`<div class="newbest">${T("r.new")}</div>`:""}
    <div class="actions"><button class="btn again" id="again">${ic("rotate-ccw")}${T("r.again")}</button>
      <div class="subs">${p.missObjs.length?`<button class="btn sub" id="redo">${T("r.redo")}</button>`:""}${p.task?"":`<button class="btn sub" onclick="go('#home')">${T("r.other")}</button>`}</div></div>
    <div class="stats"><span>${T("r.answered")} <b>${T("r.n",total)}</b></span><span>${T("r.acc")} <b>${acc}%</b></span>${p.u?"":`<span>${T("r.best")} <b>${T("r.n",all[key].score)}</b></span>`}</div>
    ${p.u?`<div class="umr"><b>${T("u.marks.t")}</b><div class="umarks big">${uMarksHtml(p.marks)}</div><div class="note">${esc(T("u.marks"))}</div>${ures&&ures.length?`<div class="ubk">${ures.map(r=>`<div class="stamp"><span class="sn">${esc(UBY[r.id].title)}<small>${T("u.best",r.o)}</small></span><span class="slots" aria-hidden="true">${MEDAL_ICO.map((em,i)=>`<span class="slot${r.medal>i?" on":""}">${msvg(r.medal>i?i+1:0)}</span>`).join("")}</span></div>`).join("")}</div>`:""}</div>`:""}
    ${p.missObjs.length?missCards(p.missObjs,p.x):""}
    ${p.task?`<div class="miss"><b>${T("r.send")}</b><br><span id="rep">${esc(repFull)}</span><br><button class="btn sub" id="cp">${T("r.copy")}</button></div>`:""}
  </div></div>`;

/* ================= じぶんの きろく（ログインなし。端末の中だけ） ================= */
/* バックアップの文字：「MH1」＋学年1けた＋（ゲームごと：ベスト2けた＋メダル1けた）＋確認3けた。英数字だけ。
   入れるのは学年・ベスト・メダルだけ（名前・IDは入らない）。読みこむときは、長さ・文字・確認の数字・範囲を調べ、
   正しいときだけ、いまの きろくより大きい数字を残す形で反映する（きろくは減らない） */
const bkeys=()=>[...GAMES.map(x=>x.id),...MODES.flatMap(m=>GAMES.map(x=>m.id+"_"+x.id))];
function bkSum(t){ let h=7; for(const c of t) h=(h*31+c.charCodeAt(0))%46656; return h.toString(36).toUpperCase().padStart(3,"0"); }
const uHash4=id=>{ let h=7; for(const c of id) h=(h*131+c.charCodeAt(0))%1679616; return h.toString(36).toUpperCase().padStart(4,"0"); };
const b36=(n,w)=>Math.min(Math.pow(36,w)-1,Math.max(0,n|0)).toString(36).toUpperCase().padStart(w,"0");
function bkMake(){      // v2：v1 に「単元ごとのベスト・メダル」を足した形（v1 の文字もそのまま読める）
  const b=bests(); let body=String(Math.min(6,Math.max(0,ui.grade|0)));
  for(const k of bkeys()){ const e=b[k]||{}; body+=b36(e.score,2)+Math.min(3,Math.max(0,e.medal|0)); }
  const us=(typeof UREADY!=="undefined"?UREADY:[]).filter(u=>b["u:"+u.id]&&(b["u:"+u.id].score||b["u:"+u.id].medal)).slice(0,300);
  body+=b36(us.length,2)+us.map(u=>{ const e=b["u:"+u.id]; return uHash4(u.id)+b36(e.score,2)+Math.min(3,Math.max(0,e.medal|0)); }).join("");
  return ("MH2"+body+bkSum("MH2"+body)).match(/.{1,6}/g).join("-");        // 読みやすいよう6文字ごとに区切る
}
function bkRead(str){
  const t=String(str||"").toUpperCase().replace(/[^0-9A-Z]/g,""), ks=bkeys();       // 区切りや空白は無視
  const v=t.slice(0,3); if(v!=="MH1"&&v!=="MH2") return null;
  const base=1+ks.length*3;
  if(t.length<3+base+3||(v==="MH1"&&t.length!==3+base+3)) return null;
  const body=t.slice(3,-3); if(bkSum(v+body)!==t.slice(-3)||!/^[0-6]$/.test(body[0])) return null;
  const out={}; let p=1;
  for(const k of ks){
    const sc=body.slice(p,p+2), m=body[p+2]; p+=3;
    if(!/^[0-9A-Z]{2}$/.test(sc)||!/^[0-3]$/.test(m)) return null;
    out[k]={score:parseInt(sc,36),medal:+m};
  }
  const u={};
  if(v==="MH2"){
    const n=parseInt(body.slice(p,p+2),36); p+=2;
    if(!(n>=0)||body.length!==p+n*7) return null;
    for(let i=0;i<n;i++,p+=7){ const h=body.slice(p,p+4), sc=body.slice(p+4,p+6), m=body[p+6];
      if(!/^[0-9A-Z]{4}$/.test(h)||!/^[0-9A-Z]{2}$/.test(sc)||!/^[0-3]$/.test(m)) return null;
      u[h]={score:parseInt(sc,36),medal:+m}; }
  }
  return {g:+body[0],b:out,u};
}
function bkApply(r){
  const all=bests();
  for(const k in r.b){ const c=all[k]||{score:0,medal:0}, n=r.b[k];
    if(n.score||n.medal) all[k]={score:Math.max(c.score||0,n.score),medal:Math.max(c.medal||0,n.medal)}; }
  for(const u of (typeof UREADY!=="undefined"?UREADY:[])){ const n=r.u&&r.u[uHash4(u.id)]; if(!n) continue;
    const c=all["u:"+u.id]||{score:0,medal:0}; all["u:"+u.id]={score:Math.max(c.score||0,n.score),medal:Math.max(c.medal||0,n.medal)}; }
  store.set("mh_best",all);
  if(r.g){ ui.grade=r.g; store.set("mh_ui",ui); }
}
/* 単元練習の記録：教科ごとに、挑戦した単元とメダル */
function unitBook(b){
  if(!UNITS_OK) return "";
  const subs=[["sansu","math"],["kokugo","jp"],["shakai","soc"],["eigo","eng"]];
  const secs=subs.map(([sj,k])=>{

    if(!us.length) return "";
    return `<div class="ubk"><h4>${subjN(k)}</h4>${us.map(u=>{ const e=b["u:"+u.id], m=e.medal|0;
      return `<div class="stamp"><span class="sn">${esc(u.title)}<small>${u.g}年《ねん》・${T("u.best",e.score)}</small></span><span class="slots" aria-hidden="true">${MEDAL_ICO.map((em,i)=>`<span class="slot${m>i?" on":""}">${msvg(m>i?i+1:0)}</span>`).join("")}</span></div>`; }).join("")}</div>`;
  }).join("");
  return `<div class="book unitbook"><h3>${T("rec.unit")}</h3>${secs||`<div class="note" style="padding:8px 0">${T("rec.unit.none")}</div>`}</div>`;
}
function uRecord(p){       // 単元ごとのベストとメダルを残す（キー u:<単元ID>）。メダルの合計にも入る
  const st=p.uSt||{}, ids=Object.keys(st).filter(i=>UBY[i]), k=Math.max(1,ids.length), all=bests();
  const need=[3,5,8].map(v=>Math.max(2,Math.ceil(v/k))), AC=[60,75,90], res=[];
  for(const id of ids){
    const s=st[id], acc=s.n?s.o/s.n*100:0; let medal=0;
    for(let i=0;i<3;i++) if(s.o>=need[i]&&acc>=AC[i]) medal=i+1;
    const key="u:"+id, prev=all[key]||{score:0,medal:0};
    all[key]={score:Math.max(prev.score,s.o),medal:Math.max(prev.medal,medal)};
    res.push({id,medal,o:s.o,n:s.n});
  }
  store.set("mh_best",all); refreshMedals(); return res;
}

function colRun(info){

  return {title:T(id==="school"||COL.PARTS.some(p=>p.id===id)?"col.p."+id:"col.d."+id),text:T("col.mm."+id)};

function exPool(S,g){
  const gr=g||3; let us=UREADY.filter(u=>u.subj==="sansu"&&u.g===gr); if(!us.length) us=UREADY.filter(u=>u.subj==="sansu");
  if(gr<=2){ const e=us.filter(u=>u.max<=(gr===1?30:100)); if(e.length>=3) us=e; }      // 1〜2年はやさしい単元だけ
  const seen=shuffle(us.filter(u=>COL.stage(S,u.id)>=1)).slice(0,3), rest=shuffle(us.filter(u=>!seen.includes(u)));
  return [...seen,...rest].slice(0,5).map(u=>u.id);                                    // 学習ずみを まぜる（ふくしゅう）
}

function exPath(tx,ty,thru){      // 近道（とびら）は ふつう 目的地のときだけ（thru なら 通りぬけも考える）。とじた・かべは 通れない
  const E=EX, key=(x,y)=>x+","+y, from=key(...E.pos), prev={[from]:null}, qu=[E.pos];
  for(let i=0;i<qu.length;i++){ const [x,y]=qu[i]; if(x===tx&&y===ty) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=E.map.W||ny>=E.map.H||key(nx,ny) in prev) continue;
      const c=E.st[ny][nx]; if(c==="w"||c==="x") continue; if((c==="d"||c==="F")&&!thru&&!(nx===tx&&ny===ty)) continue;
      prev[key(nx,ny)]=key(x,y); qu.push([nx,ny]); } }
  if(!(key(tx,ty) in prev)) return null;
  const p=[]; for(let k=key(tx,ty);k!==null;k=prev[k]) p.push(k.split(",").map(Number)); return p.reverse().slice(1);
}
function exTap(tx,ty){
  const E=EX; if(!E||E.busy||E.q||E.done) return;
  const c=E.st[ty]&&E.st[ty][tx]; if(!c||c==="w"||c==="x") return;
  const path=exPath(tx,ty)||exPath(tx,ty,true); if(!path||!path.length){ if(!path) exDraw("col.ex.stuck"); return; }
  E.busy=true; sfx("ok");
  const step=()=>{
    if(EX!==E) return;
    const [x,y]=path.shift(), cc=E.st[y][x];
    if(cc==="d"||cc==="F"){ E.busy=false; return exAsk(x,y,cc==="F"); }
    E.pos=[x,y]; E.steps++;
    if(cc==="g"){ E.busy=false; exDraw(); return exGoal(); }
    exDraw(); if(path.length) E.tm=setTimeout(step,130); else E.busy=false;
  };
  step();
}
function exAsk(x,y,fin){
  const E=EX; if(E.qi>=E.qs.length){ E.qs=UN.unitPick(E.ids,10,E.seed+"-"+E.qi,true); E.qi=0; }
  const c=uCur(E.qs[E.qi++],true); E.asked++;
  E.q={c,x,y,fin,tries:0,lock:false}; exDraw();
  const b=app.querySelector(".exq .choice"); if(b) b.focus({preventScroll:true});
  const pn=app.querySelector(".exq"); if(pn) pn.scrollIntoView({block:"nearest"});

function exPick(b){
  const E=EX, q=E&&E.q; if(!q||q.lock||b.disabled) return;
  const c=q.c, right=b.dataset.c===c.a, fb=$("#exfb"); q.lock=true; sfx(right?"ok":"ng");
  const all=[...app.querySelectorAll(".exq .choice")];
  if(right){ all.forEach(e=>e.classList.add(e.dataset.c===c.a?"right":"wrong")); fb.className="fb ok"; E.right++;
    if(q.fin&&(E.fgot|0)<1){ E.fgot=(E.fgot|0)+1; fb.textContent=T("col.ex.ok2"); setTimeout(()=>{ if(EX!==E) return; E.q=null; exAsk(q.x,q.y,true); },900); return; }      // ゴールの手前のとびらは 2もん せいかい
    fb.textContent=T("col.ex.ok");
    setTimeout(()=>{ if(EX!==E) return; E.st[q.y][q.x]="o"; E.pos=[q.x,q.y]; E.steps++; E.q=null; exDraw(); },650); return; }
  E.wrong++;

  fb.className="fb ng"; fb.textContent=T(q.fin?"col.ex.ngf":"col.ex.ng",c.a);

  setTimeout(()=>{ if(EX!==E) return;
    if(q.fin){ E.q=null; exAsk(q.x,q.y,true); }                       // さいごの とびらは 何度でも（べつの もんだい）
    else { E.st[q.y][q.x]="x"; E.q=null; exDraw(); } },2200);          // 近道が とじるだけ。遠まわりの みちが ある
}

    box.scrollIntoView({block:"nearest"});
  });

function hrQr(box,text){
  loadScript("vendor/qrcode-generator-2.0.4.js",()=>typeof qrcode==="function").then(()=>{
    const q=qrcode(0,"L"); q.addData(text.replace(/[^0-9A-Z]/g,"")); q.make(); box.innerHTML=q.createSvgTag({cellSize:4,margin:4,scalable:true});
  }).catch(()=>{});
}
function colImport(v){        // 形式チェックを通った物だけ反映。記録は減らない合成
  const r=colMode()==="on"?COL.hrParse(v):null; if(!r) return false;
  const S=colGet(); COL.hrMerge(S,r,colToday()); colSave(); return true;
}
function colBackupBind(){
  const mk=$("#hrMake"); if(!mk) return;
  mk.onclick=()=>{ const s=COL.hrMake(colTouch()); $("#hrCode").textContent=s; $("#hrOut").classList.remove("hidden"); hrQr($("#hrQr"),s); };
  $("#hrCopy").onclick=()=>navigator.clipboard?.writeText($("#hrCode").textContent).then(()=>$("#hrCopy").textContent=T("r.copied"),()=>{});
  $("#hrGo").onclick=()=>{
    const m=$("#hrMsg"), v=$("#hrIn").value.trim();
    if(!v){ m.className="err"; m.textContent=T("rec.bk.empty"); return; }
    if(!colImport(v)){ m.className="err"; m.textContent=T("rec.bk.ng"); return; }
    m.className="okmsg"; m.textContent=T("col.bk.ok");
  };
}

/* ================= 教室で映す ================= */
function startProjector(id,g,n,sec){
  setLG(0);
  const x=GAMES.find(y=>y.id===id);
  const qs=[]; const seen=new Set();
  for(let i=0;qs.length<n&&i<200;i++){ const q=gen(id,g); if(!seen.has(q.q)){seen.add(q.q);qs.push(q);} }
  const el=document.createElement("div"); el.className="proj"; document.body.appendChild(el);
  let i=0, tid=0;
  const cols=["var(--a)","var(--b)","var(--c)","var(--d)"], fgs=["#fff","#fff","#2b2200","#fff"], lab=["A","B","C","D"];
  const close=()=>{clearInterval(tid); el.remove();};
  function show(){
    const q=qs[i]; let left=sec;
    const draw=(reveal)=>{
      el.innerHTML=`<div class="ptop"><span>${x.ico} ${x.t}（${g}年《ねん》）</span><span>${i+1} / ${qs.length}</span><span class="count">${reveal?"":left}</span></div>
        <div class="pq"><div>${esc(q.q)}<div style="font-size:.35em;opacity:.7;margin-top:10px">${esc(q.small||"")}</div></div></div>
        <div class="pc">${q.ch.map((c,k)=>`<div class="${reveal&&c!==q.a?"dim":""}" style="background:${cols[k]};color:${fgs[k]}">${lab[k]}. ${chLabel(c,q)}${reveal&&c===q.a?" ⭕":""}</div>`).join("")}</div>
        <div class="pbtns">${reveal
          ?(i<qs.length-1?`<button class="btn" id="nx">次《つぎ》の問題《もんだい》 →</button>`:`<button class="btn" id="fin">おわり</button>`)
          :`<button class="btn sub" id="rv">答《こた》えを見《み》せる</button>`}
          <button class="btn sub" id="cl">とじる</button></div>`;
      el.querySelector("#cl").onclick=close;
      const rv=el.querySelector("#rv"); if(rv) rv.onclick=()=>{clearInterval(tid);draw(true)};
      const nx=el.querySelector("#nx"); if(nx) nx.onclick=()=>{i++;show()};
      const fin=el.querySelector("#fin"); if(fin) fin.onclick=close;
    };
    draw(false);
    clearInterval(tid);
    tid=setInterval(()=>{ left--; if(left<=0){clearInterval(tid);draw(true);} else { const c=el.querySelector(".count"); if(c) c.textContent=left; } },1000);
  }
  show();
}

/* ================= バトルモード（Blooket型：同じ問題をいろいろな遊び方で） ================= */
const MODES=[{id:"chest",ico:"🎁",art:"a-chest"},{id:"race",ico:"🎲",art:"a-dice"}];
MODES.forEach(m=>{ tget(m,"t","m."+m.id+".t"); tget(m,"d","m."+m.id+".d"); });

/* ルール：やさしい＝たからばこで「うばう・入れかえ・落とす」が出ない／すごろくに🌀（もどる）がない */
const RULES=[{id:"normal",t:"ふつう"},{id:"easy",t:"やさしい"}];
RULES.forEach(r=>tget(r,"d","ru."+r.id+".d"));
const ruleOf=v=>v==="easy"?"easy":"normal";
const ruleName=v=>ruleOf(v)==="easy"?"やさしいルール":"ふつうのルール";
const defaultRule=g=>g===1||g===2?"easy":"normal";   // 1〜2年は「やさしい」が初期値
function evOf(rule){ if(ruleOf(rule)!=="easy") return EV; const e={}; for(const k in EV) if(EV[k]!=="🌀") e[k]=EV[k]; return e; }
const rr=(a,b)=>a+Math.random()*(b-a);

/* 計算問題も4択にする（タブレットで押しやすく） */
function genChoice(id,g){
  const q=gen(id,g); if(q.ch) return q;
  const a=q.a, dec=(String(a).split(".")[1]||"").length, step=Math.pow(10,-dec), c=new Set();
  for(const o of shuffle([1,2,3,10,-1,-2,-3,-10])){ const v=+(a+o*step).toFixed(dec); if(v>=0&&v!==a) c.add(v); if(c.size>=3) break; }
  return {q:q.q,a:String(a),ch:shuffle([a,...c].map(String)),small:"= ?"};
}

function leaderBot(){ return [...M.bots].sort((a,b)=>b.v-a.v)[0]; }
/* やさしいルール：順位の数字は出さず、上の3人と自分だけ（最下位は出さない） */
function easyList(ps){ const top=ps.slice(0,3).map(p=>[p,0]), i=ps.findIndex(p=>p.me); return i>=3?[...top,[ps[i],0]]:top; }
const rankRows=(rows,unit)=>rows.map(([p,i])=>`<div class="rank ${p.me?"me":""}">${i?i+". ":""}${face(p.e)} ${esc(p.n)}<span class="v">${unit(p)}</span></div>`).join("");

/* たからばこの中身と出やすさ（重み）。「？」の表も同じ数字を使う */
function chestTable(rule){
  return ruleOf(rule)==="easy"
    ?[["+10",24],["+20",26],["+30",18],["+50",12],["x2",8],["none",2]]          // やさしい：増えるか からっぽ だけ
    :[["+10",20],["+20",22],["+30",16],["+50",10],["x2",8],["lose",8],["steal",10],["swap",4],["none",2]];
}
const chestLabel=k=>k[0]==="+"?`🪙 ${k}`:T("c."+k);
function rollChest(rule){
  const tb=chestTable(rule);
  let r=Math.random()*tb.reduce((n,x)=>n+x[1],0); for(const [k,w] of tb){ if((r-=w)<0) return k; } return "+10";
}
function openBox(btn){
  if(M.phase!=="reward") return; M.phase="wait";
  if(M.net) return netBox(rollChest(M.rule),btn);

  if(k[0]==="+"){ const n=+k.slice(1); M.me.v+=n; label=`🪙 +${n}`; msg=T("b.get",n); }
  else if(k==="x2"){ M.me.v*=2; label=T("c.x2"); msg=T("b.x2"); }
  else if(k==="lose"){ const n=Math.round(M.me.v*0.25); M.me.v-=n; label=`💸 −${n}`; msg=T("b.lose"); }
  else if(k==="steal"){ const n=Math.round(L.v*0.2); L.v-=n; M.me.v+=n; label=`🦝 +${n}`; msg=T("b.steal",`${face(L.e)}${esc(L.n)}`,n); }
  else if(k==="swap"){ if(L.v>M.me.v){ [L.v,M.me.v]=[M.me.v,L.v]; label=T("c.swapdone"); msg=T("b.swap",`${face(L.e)}${esc(L.n)}`); } else { M.me.v+=20; label="🪙 +20"; msg=T("b.get",20); } }
  else { label=T("c.none"); msg=T("b.none"); }
  btn.classList.add("open"); btn.textContent=label;
  $("#mmain").querySelectorAll(".box").forEach(b=>{ if(b!==btn) b.classList.add("dim"); });
  $("#msg").innerHTML=msg; drawSide();
  const mm=M; setTimeout(()=>M===mm&&showQ(),1300);
}

const GOAL=40, EV={4:"⭐",9:"🌀",13:"⭐",17:"🌀",21:"⭐",25:"🌀",27:"⭐",31:"🌀",35:"⭐",38:"🌀"};
function raceReward(){

          if(r.v<GOAL) setTimeout(showQ,1200);
        }).catch(()=>{});
        return;
      }
      let msg=T("b.go",n); M.me.v=Math.min(GOAL,M.me.v+n);
      const e=M.ev[M.me.v];
      if(e==="⭐"){ M.me.v=Math.min(GOAL,M.me.v+3); msg+=T("b.star"); }
      if(e==="🌀"){ M.me.v=Math.max(0,M.me.v-2); msg+=T("b.swirl"); }
      $("#msg").textContent=msg; drawSide();
      if(M.me.v>=GOAL) return setTimeout(modeFinish,1500);       // 駒がゴールまで進むのを見せてから結果へ
      setTimeout(showQ,1200);
    },600);
  };
}

/* --- CPU の動き --- */
/* CPUの待ち時間：学年の係数（1〜2年は1.8倍ゆっくり、3〜4年は1.3倍、5〜6年は1倍）。
   さらに、自分が最下位のCPUより大きく負けているときは、CPUの待ちを1.5秒のばす（ゴムひも）。 */
const botK=g=>g<=2?1.8:g<=4?1.3:1;
function botRubber(b){
  const low=Math.min(...M.bots.map(x=>x.v));
  return (M.me.v<low&&b.v>low)?RUBBER:0;      // 自分が最下位のとき、上位のCPUの待ちをのばす
}
const RUBBER=2;
const BOT_NORMAL={x2:0.08,gain:[10,20,20,30,50]}, BOT_EASY={x2:0.04,gain:[10,10,10,10,20,20]};   // CPUがたからばこでもらう量（やさしいルールは少なめ）
function botTick(dt){
  for(const b of M.bots){
    b.wait-=dt*b.spd; if(b.wait>0) continue;
    if(M.m.id==="chest"){
      b.wait=rr(3.5,6.5)*botK(M.g)+botRubber(b);
      const r=Math.random();
      const E=M.rule==="easy"?BOT_EASY:BOT_NORMAL;
      if(r<E.x2) b.v*=2; else if(r<0.14&&M.rule!=="easy") b.v=Math.round(b.v*0.75); else b.v+=E.gain[rnd(E.gain.length)];   // やさしいルールのCPUは、たまにもらう量も少なめ
    } else {
      b.wait=rr(4.5,7.5)*botK(M.g)+botRubber(b);
      b.v=Math.min(GOAL,b.v+1+rnd(4));
      const e=M.ev[b.v]; if(e==="⭐") b.v=Math.min(GOAL,b.v+3); if(e==="🌀") b.v=Math.max(0,b.v-2);
      if(b.v>=GOAL){ if(!M.finishing){ M.finishing=true; M.phase="wait"; setTimeout(()=>modeFinish(),1500); } return; }
    }
  }
}
function drawSide(){
  if(!M) return;
  const ps=[...players()].sort((a,b)=>b.v-a.v);

  const r=Math.floor((i-1)/BD.COLS); let c=(i-1)%BD.COLS; if(r%2) c=BD.COLS-1-c;

async function srvApi(name,body){
  const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:"通信エラー"}));
  if(!r.ok) throw new Error(j.error||"通信エラー");

function srvListen(code,onState,onLost){
  /* 先生の画面は hostKey、児童の画面は自分の pid と token を、URL ではなく POST の本文で添える（URL はログやプロキシに残りうるため）。
     サーバーは、先生にだけ全員の名前を送る。切れたら2秒後につなぎなおし、部屋が無ければ onLost */
  const who=HOST&&HOST.code===code&&HOST.hostKey?{hostKey:HOST.hostKey}:NET&&NET.code===code?{pid:NET.pid,token:NET.token}:{};
  const ctl=new AbortController(); let closed=false;
  (async()=>{
    while(!closed){
      try{
        const r=await fetch("/api/events",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,...who}),signal:ctl.signal});
        if(r.status===404){ if(!closed) onLost(); return; }
        const rd=r.body.getReader(), dec=new TextDecoder(); let buf="";
        for(;;){
          const {value,done}=await rd.read(); if(done) break;
          buf+=dec.decode(value,{stream:true}); let i;
          while((i=buf.indexOf("\n\n"))>=0){ const ev=buf.slice(0,i); buf=buf.slice(i+2);
            const d=ev.split("\n").filter(l=>l.startsWith("data: ")).map(l=>l.slice(6)).join("\n");
            if(d){ let s=null; try{ s=JSON.parse(d); }catch(e){} if(s&&!closed) onState(s); } }
        }
      }catch(e){ if(closed) return; }
      if(!closed) await new Promise(ok=>setTimeout(ok,2000));
    }
  })();
  return {close(){ closed=true; try{ctl.abort()}catch(e){}; }};
}

      who={name:NM.dedupe(c.name,hrNames(r)),emoji:hrEmoji(r)};
    } else who=hrNick(r);
    const p={pid:rid(),token:rid(),...who,v:0,ok:0,ng:0}; r.players.set(p.pid,p); if(r.qz) r.qz.add(p.pid); if(r.co) r.co.add(p.pid); hrBroadcast(r);
    return [200,{code:r.code,pid:p.pid,token:p.token,name:p.name,emoji:p.emoji,nm:r.nm}];
  }
  if(name==="reroll"){ const p=pl(); if(!p||r.status!=="lobby") return [409,{error:"今は変えられません"}];
    if(r.nm==="input") p.emoji=hrEmoji(r); else Object.assign(p,hrNick(r)); hrBroadcast(r); return [200,{name:p.name,emoji:p.emoji}]; }
  if(name==="rename"){ const p=pl(); if(!p||r.status!=="lobby"||r.nm!=="input") return [409,{error:"今は変えられません"}];
    const c=NM.check(b.name); if(!c.ok) return [400,{error:NAME_ERR[c.why],why:c.why}];
    p.name=NM.dedupe(c.name,hrNames(r,p)); hrBroadcast(r,true); return [200,{name:p.name,emoji:p.emoji}]; }
  /* 先生の端末からだけ（児童の接続からは呼べない）：名前をかえる／ニックネームにする／へやから出す */
  if(name==="hrename"||name==="hnick"||name==="kick"){
    const p=r.players.get(b.pid); if(!p) return [403,{error:"その子は見つかりません"}];
    if(name==="hrename"){ const c=NM.check(b.name); if(!c.ok) return [400,{error:NAME_ERR[c.why],why:c.why}]; p.name=NM.dedupe(c.name,hrNames(r,p)); }
    else if(name==="hnick") Object.assign(p,hrNick(r,p));
    else { r.players.delete(p.pid); if(r.co) r.co.remove(p.pid); if(r.qz){ r.qz.remove(p.pid); if(r.status==="playing"&&r.qz.tick(Date.now())) qzSync(r); }
      for(const c of [...r.conns]) if(c._pid===p.pid){ try{c.send({type:"state",s:hrPub(r,false)})}catch(e){} c._pid=""; r.conns.delete(c); } }
    hrBroadcast(r,true); return [200,{ok:true}];
  }
  if(name==="close"){ r.closed=!!b.on; hrBroadcast(r,true); return [200,{ok:true,closed:r.closed}]; }      // 先生：入室をしめきる／あける
  if(name==="start"){ if(!r.players.size) return [409,{error:"まだ誰も参加していません"}];
    for(const p of r.players.values()) Object.assign(p,{v:0,ok:0,ng:0});
    if(r.qz){ r.status="playing"; r.endAt=0; r.qz.begin(Date.now()); qzSync(r); hrBroadcast(r,true); return [200,{ok:true}]; }
    if(r.co){ r.status="playing"; r.endAt=0; r.co.begin(Date.now()); hrBroadcast(r,true); return [200,{ok:true}]; }
    r.status="playing"; r.endAt=Date.now()+r.t*1000+3000; hrBroadcast(r,true); return [200,{ok:true}]; }
  if(name==="end"){ hrEnd(r); return [200,{ok:true}]; }
  if(name==="qnext"){ if(!r.qz||r.status!=="playing") return [409,{error:"今は進められません"}];      // クイズ：先生が「つぎへ」（出題中なら しめきる）
    if(r.qz.next(Date.now())){ qzSync(r); if(r.qz.phase==="end") hrEnd(r); else hrBroadcast(r,true); } return [200,{ok:true}]; }
  if(name==="qreplay"){ if(!r.qz||r.status!=="ended") return [409,{error:"今は始められません"}];     // クイズ：正答率の低い問題だけ、同じ部屋でもう一度
    const low=r.qz.low(0.6).map(i=>r.qz.qs[i]); if(!low.length) return [409,{error:"正答率の低い問題はありません"}];
    r.status="playing"; r.endAt=0; r.qz.begin(Date.now(),low); qzSync(r); hrBroadcast(r,true); return [200,{ok:true}]; }
  if(name==="set"){ const p=pl(); if(!p||!r.set) return [403,{error:"参加情報が正しくありません"}]; return [200,r.set]; }     // たからばこ・すごろくで使う先生のもんだい
  if(name!=="act") return [400,{error:"不明な操作です"}];
  const p=pl(); if(!p) return [403,{error:"参加情報が正しくありません"}];
  if(r.status!=="playing") return [409,{error:"対戦中ではありません"}];
  const MODE_OPS={chest:["add","x2","lose","steal","swap"],race:["move"],quiz:["qans"],rocket:["cans","boost","mini"]};   // 遊び方ごとに受け付ける操作
  if(b.op!=="answer"&&!(MODE_OPS[r.mode]||[]).includes(b.op)) return [403,{error:"この遊び方では使えない操作です"}];
  if(r.rule==="easy"&&["steal","swap","lose"].includes(b.op)) return [403,{error:"やさしいルールの部屋では使えません"}];
  if(r.co){      // 協力モード：判定は共有部品（cooplib）。児童の値は型・範囲を調べてから使う
    const a=r.co.act(p.pid,b.op,b,Date.now()); if(a[0]===200){ if(a[2]) hrBroadcast(r,true); else hrBroadcast(r); }
    return [a[0],a[1]];
  }
  if(r.qz){      // クイズ：答えの番号だけ受け取り、点数は先生の端末が決める
    if(b.op!=="qans") return [403,{error:"この遊び方では使えない操作です"}];
    const a=r.qz.answer(p.pid,b.i,b.c,Date.now()); if(!a.ok) return [409,{error:a.why==="late"?"もう時間がおわりました":"この答えは使えません"}];
    if(r.qz.tick(Date.now())){ qzSync(r); hrBroadcast(r,true); } else hrBroadcast(r);
    return [200,{ok:true}];
  }
  const out={ok:true}, leader=()=>[...r.players.values()].filter(q=>q!==p).sort((a,c)=>c.v-a.v)[0];
  switch(b.op){
    case "answer": b.right?p.ok++:p.ng++; break;
    case "add": p.v+=Math.min(50,Math.max(0,b.n|0)); break;
    case "x2": if(r.mode==="chest") p.v=Math.min(p.v*2,100000); break;
    case "lose": out.n=Math.round(p.v*0.25); p.v-=out.n; break;
    case "steal": { const t=leader(); if(t&&t.v>0){ out.n=Math.round(t.v*0.2); t.v-=out.n; p.v+=out.n; out.target=t.emoji; } else { out.n=20; p.v+=20; } break; }
    case "swap": { const t=leader(); if(t&&t.v>p.v){ [t.v,p.v]=[p.v,t.v]; out.target=t.emoji; } else { p.v+=20; out.n=20; } break; }
    case "move": { if(r.mode!=="race") break; const n=Math.min(6,Math.max(1,b.n|0)); p.v=Math.min(GOAL,p.v+n);
      out.ev=evOf(r.rule)[p.v]||""; if(out.ev==="⭐") p.v=Math.min(GOAL,p.v+3); if(out.ev==="🌀") p.v=Math.max(0,p.v-2); break; }
    default: return [400,{error:"不明な操作です"}];
  }
  out.v=p.v;
  if(r.mode==="race"&&p.v>=GOAL) hrEnd(r); else hrBroadcast(r);
  return [200,out];
}
function hrHandle(r,conn,m){
  if(!m||typeof m!=="object"||!m.id) return;
  let res;
  const body=m.body&&typeof m.body==="object"?m.body:{};
  if(m.name==="info") res=hrApi(r,"info",{});
  else if(m.name==="join"){
    if(!hrRate(r,conn)) res=[429,{error:"しばらくしてから、もう一度ためしてね"}];
    else{
      const old=!hrJoinBlock(r)&&conn._pid&&r.players.get(conn._pid);      // 同じ接続でもう一度入るときは、前の分を外す（1つの接続で人数をふやさない）
      if(old){ r.players.delete(old.pid); if(r.qz) r.qz.remove(old.pid); if(r.co) r.co.remove(old.pid); conn._pid=""; }
      res=hrApi(r,"join",{name:body.name}); if(res[0]===200){ r.conns.add(conn); conn._pid=res[1].pid; } else if(old) hrBroadcast(r);
    }
  }
  else if(m.name==="hello"){ const b=body, p=r.players.get(b.pid);
    if(p&&p.token===b.token){ r.conns.add(conn); conn._pid=p.pid; res=[200,{ok:true}]; } else res=[403,{error:"参加情報が見つかりません"}]; }
  else if(m.name==="reroll"||m.name==="rename"||m.name==="act"||m.name==="set") res=hrApi(r,m.name,body);
  else res=[400,{error:"不明な操作です"}];               // start / end / 名前の管理は児童からはできない
  try{ conn.send({id:m.id,status:res[0],obj:res[1]}); }catch(e){}
  if(res[0]===200&&(m.name==="join"||m.name==="hello")) try{ conn.send({type:"state",s:hrKid(r,conn)}); }catch(e){}
}
async function hrCreate(s){
  let set=null, qz=null;
  const co=s.mode==="rocket"?COOP.engine({easy:ruleOf(s.rule)==="easy",g:s.g}):null;      // 協力モード「ロケット はっしゃ」
  if(s.mode==="quiz"||s.game==="mine"){        // 先生のもんだい：型・文字数・個数・時間の値を調べてから使う
    const c=QZ.cleanSet({title:s.gt,qs:s.qs}); if(!c.ok) throw new Error("もんだいが正しくありません："+c.why);
    const qs=s.mode==="quiz"?c.set.qs:c.set.qs.filter(x=>x.t==="mc"); if(!qs.length) throw new Error("4択の問題がありません");
    set={title:c.set.title,qs}; if(s.mode==="quiz") qz=QZ.engine(qs,{easy:ruleOf(s.rule)==="easy"});
  }
  await loadPeer();
  if(HR){ clearInterval(HR.iv); try{HR.peer.destroy()}catch(e){} HR=null; }
  for(let i=0;i<5;i++){
    const code=String(1000+rnd(9000)), peer=new Peer(PEER_PREFIX+code);
    try{ await withTimeout(new Promise((ok,ng)=>{peer.on("open",ok);peer.on("error",ng);}),10000,"つなぎ役のサーバーに接続できませんでした"); }
    catch(e){ try{peer.destroy()}catch(_){} if(e&&e.type==="unavailable-id") continue;
      throw new Error("つなぎ役のサーバーに接続できませんでした"+(e&&e.type?"（"+e.type+"）":"")); }
    const r={code,mode:s.mode,game:s.mode==="quiz"?"quiz":s.game,g:s.g,t:co?300:s.t,rule:ruleOf(s.rule),status:"lobby",endAt:0,players:new Map(),conns:new Set(),allc:new Set(),closed:false,listeners:new Set(),timer:null,peer,gt:set?set.title:"",set:qz?null:set,qz,co,nm:s.nm==="auto"?"auto":"input"};
    peer.on("connection",conn=>{ if(r.allc.size>=200){ try{conn.close()}catch(e){} return; }      // つながる数の上限（いたずら対策）
      r.allc.add(conn); conn.on("data",m=>hrHandle(r,conn,m)); conn.on("close",()=>{ r.conns.delete(conn); r.allc.delete(conn); }); });
    peer.on("disconnected",()=>{ try{peer.reconnect()}catch(e){} });   // 途中参加できるよう仲介サーバーにつなぎ直す
    r.iv=setInterval(()=>{ if(r.status!=="playing") return;
      if(r.co){ if(r.co.tick(Date.now())){ if(r.co.ph==="end") hrEnd(r); else hrBroadcast(r,true); } }
      else if(r.qz){ if(r.qz.tick(Date.now())){ qzSync(r); if(r.qz.phase==="end") hrEnd(r); else hrBroadcast(r,true); } }
      else if(Date.now()>=r.endAt) hrEnd(r); },(r.qz||r.co)?250:1000);
    HR=r; return {code,hostKey:"local",nm:r.nm};
  }
  throw new Error("部屋を作れませんでした。もう一度ためしてください");
}

/* 児童の端末から先生の端末へつなぐ */
let KC=null;
async function kcConnect(code){
  await loadPeer();
  if(KC){ try{KC.peer.destroy()}catch(e){} KC=null; }
  const peer=new Peer(), k={peer,conn:null,code,pending:new Map(),seq:0,onState:null,onLost:null};
  KC=k;
  await withTimeout(new Promise((ok,ng)=>{peer.on("open",ok);peer.on("error",ng);}),10000,"つなぎ役のサーバーに接続できませんでした")
    .catch(e=>{throw new Error(e.message||"つなぎ役のサーバーに接続できませんでした")});
  const conn=peer.connect(PEER_PREFIX+code,{reliable:true});
  await withTimeout(new Promise((ok,ng)=>{
    conn.on("open",ok);
    peer.on("error",e=>ng(new Error(e.type==="peer-unavailable"?"その部屋コードは見つかりません":"先生の端末につながりませんでした")));
  }),12000,"先生の端末につながりませんでした（学校のネットワークで止められているかもしれません）");
  k.conn=conn;
  conn.on("data",m=>{
    if(!m) return;
    if(m.type==="state") return k.onState&&k.onState(m.s);
    const pr=k.pending.get(m.id); if(!pr) return; k.pending.delete(m.id);
    m.status===200?pr.ok(m.obj):pr.ng(new Error((m.obj&&m.obj.error)||"エラー"));
  });
  conn.on("close",()=>{ if(KC===k&&k.onLost) k.onLost(); });
  return k;
}
function kcReq(name,body){
  const k=KC; if(!k||!k.conn||!k.conn.open) return Promise.reject(new Error("先生の端末との接続が切れました"));
  const id=++k.seq;
  return withTimeout(new Promise((ok,ng)=>{ k.pending.set(id,{ok,ng}); k.conn.send({id,name,body}); }),8000,"先生の端末から返事がありません");
}

/* ---- 画面からはこの2つだけを使う ---- */
async function api(name,body){
  if(NETMODE==="server") return srvApi(name,body);
  if(name==="create") return hrCreate(body);
  if(name==="start"||name==="end"||name==="qnext"||name==="qreplay"||name==="hrename"||name==="hnick"||name==="kick"||name==="close"){
    if(!HR||HR.code!==body.code) throw new Error("この端末で作った部屋ではありません");
    const [c,o]=hrApi(HR,name,body); if(c!==200) throw new Error(o.error); return o;
  }
  if(name==="info"){ await kcConnect(String(body.code)); return kcReq("info",{}); }
  if(name==="join"){ const code=String(body.code); if(!KC||KC.code!==code||!KC.conn||!KC.conn.open) await kcConnect(code); return kcReq("join",{name:body.name}); }
  return kcReq(name,body);
}
function listen(code,onState,onLost){
  if(ES) ES.close();
  const host=!!(HOST&&HOST.code===code), on0=onState;
  onState=s=>{ if(s&&typeof s==="object"){ if(typeof s.nm==="string") LASTNM=s.nm;
      if(!host&&typeof s.me==="string"&&NET&&Array.isArray(s.players)) for(const p of s.players) if(p.pid===NET.pid) p.name=s.me;     // 自分の名前だけ受け取る
    } on0(s); };
  if(NETMODE==="server"){ ES=srvListen(code,onState,onLost); return; }
  if(HR&&HR.code===code){                       // 先生の端末：自分の部屋を見る
    const f=s=>onState(s); HR.listeners.add(f);
    ES={close(){ if(HR) HR.listeners.delete(f); }};
    onState(hrPub(HR,true)); return;
  }
  let closed=false;                              // 児童の端末
  ES={close(){ closed=true; if(KC){KC.onState=null;KC.onLost=null;} }};
  (async()=>{
    try{
      if(!KC||KC.code!==code||!KC.conn||!KC.conn.open) await kcConnect(code);
      if(closed) return;
      KC.onState=onState; KC.onLost=onLost;
      await kcReq("hello",NET);
    }catch(e){ if(!closed) onLost(); }
  })();
}

/* --- 児童：待合室 → 対戦 → 結果 --- */
function renderLobby(){
  NET=NET||sget("mh_net"); if(!NET) return go("#join");
  listen(NET.code,s=>{
    if(s.mode==="rocket"&&s.status!=="lobby"){ if(typeof s.me!=="string") return kickedView(); return rkKidState(s); }      // 協力モード：対戦中は人の一覧が来ない。自分の名前（me）が無ければ、へやから出された
    if(!s.players.some(p=>p.pid===NET.pid)) return kickedView();       // 先生が へやから だした
    if(s.mode==="quiz") return qzKidState(s);
    if(s.status==="lobby") lobbyView(s);
